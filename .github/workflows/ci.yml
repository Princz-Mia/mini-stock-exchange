name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ORACLE_JDK: "25.0.5"
  FLINK_JDK: "17.0.20"

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.FLINK_JDK }}
      - name: Point Flink tests at JDK 17
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: oracle
          java-version: ${{ env.ORACLE_JDK }}
          cache: maven
      - name: Build, unit and Testcontainers integration tests
        run: sh ./mvnw -B -ntp verify

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The client types must match the OpenAPI contract exactly.
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  simulator:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q

  compatibility-gate:
    runs-on: ubuntu-24.04
    needs: [java, web, simulator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The whole history, which the security step scans for secrets.
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.FLINK_JDK }}
      - name: Point Flink tests at JDK 17
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: oracle
          java-version: ${{ env.ORACLE_JDK }}
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Chromium and its system libraries for the browser test
        working-directory: web
        # Chromium comes from Playwright's own host. Its system libraries come from apt, but the runner images already
        # carry them for their preinstalled Chrome, so an Ubuntu mirror that does not answer is no reason to fail: apt
        # gets five minutes, and without it the browser test runs on the image's libraries.
        run: |
          npm ci
          npx playwright install chromium
          if ! timeout 300 npx playwright install-deps chromium; then
            echo "::warning::Ubuntu packages unreachable; using the runner image's system libraries for Chromium"
          fi
      - name: Container builds and full-pipeline smoke test
        run: bash scripts/compat-gate.sh
      - name: Keep gate logs
        if: always()
        run: |
          tail -n 40 runtime/compat-gate/summary.txt || true
          # The failing step's own log says why; it is named after the step, as the gate names it.
          step=$(sed -n 's/^FAIL  //p' runtime/compat-gate/summary.txt 2>/dev/null | head -n 1 | sed -E 's/ +[0-9]+s.*$//')
          if [ -n "$step" ]; then
            log="runtime/compat-gate/$(printf '%s' "$step" | tr -cs 'A-Za-z0-9' '-' | tr 'A-Z' 'a-z').log"
            echo "::group::$log"
            tail -n 200 "$log" || true
            echo "::endgroup::"
          fi
      # The reports: the accessibility scan of every screen and state with its screenshots, and the security scans.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-reports
          path: |
            web/test-results/accessibility/
            web/test-results/screens/
            runtime/compat-gate/security/
          if-no-files-found: warn
          retention-days: 30
