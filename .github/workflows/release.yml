name: Release

# A version tag (v0.1.0) builds the five images, publishes them to GitHub Container Registry, starts the published
# images on a fresh runner exactly as a user would, and only then creates the GitHub release, with the tag's own
# annotation as its notes. A pull request that changes this workflow builds the images without publishing anything.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - compose.release.yaml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/princz-mia/mini-stock-exchange
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: execution-service
            context: .
            file: services/execution-service/Dockerfile
          - name: market-data-service
            context: .
            file: services/market-data-service/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
          - name: simulator
            context: simulator
            file: simulator/Dockerfile
          - name: analytics-job
            context: .
            file: analytics-job/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
          # The source label links each package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The release check: the published images, pulled on a fresh machine, start the whole stack and seed the demo market.
  verify:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      MSE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the published release
        run: |
          ./scripts/init-env.sh
          docker compose -f compose.yaml -f compose.release.yaml --profile full up -d --no-build --wait --wait-timeout 300
      - name: Every built service runs its published image
        run: |
          docker compose -f compose.yaml -f compose.release.yaml --profile full ps --format '{{.Service}} {{.Image}}' | tee images.txt
          for service in execution-service market-data-service web flink-jobmanager flink-taskmanager simulator; do
            grep -E "^$service $REGISTRY/[a-z-]+:$MSE_VERSION$" images.txt || { echo "$service is not on $MSE_VERSION"; exit 1; }
          done
      - name: The demo market is open
        run: |
          docker compose -f compose.yaml -f compose.release.yaml --profile full logs --no-log-prefix demo-seed
          curl -fsS http://localhost:8080/api/v1/market | tee market.json
          grep -q '"state":"OPEN"' market.json
          test "$(curl -fsS http://localhost:8080/api/v1/instruments | grep -o '"symbol":"[A-Z]*"' | wc -l)" = 5
      - name: Logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.release.yaml --profile full logs --tail 200

  release:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release from the tag's notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
