spring.application.name=market-data-service
server.port=8080
server.shutdown=graceful

# Runtime connections use the least-privilege role; only Flyway uses the owner role.
spring.datasource.url=${MARKET_DATA_DB_URL:jdbc:postgresql://localhost:15432/market_data_db}
spring.datasource.username=${MARKET_DATA_DB_APP_USER:market_data_app}
spring.datasource.password=${MARKET_DATA_DB_APP_PASSWORD}
spring.datasource.hikari.pool-name=market-data
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${MARKET_DATA_DB_OWNER_USER:market_data_owner}
spring.flyway.password=${MARKET_DATA_DB_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
