spring.application.name=execution-service
server.port=8080
server.shutdown=graceful

# Runtime connections use the least-privilege role; only Flyway uses the owner role.
spring.datasource.url=${EXECUTION_DB_URL:jdbc:postgresql://localhost:15432/execution_db}
spring.datasource.username=${EXECUTION_DB_APP_USER:execution_app}
spring.datasource.password=${EXECUTION_DB_APP_PASSWORD}
spring.datasource.hikari.pool-name=execution
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${EXECUTION_DB_OWNER_USER:execution_owner}
spring.flyway.password=${EXECUTION_DB_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration

# Session tables are owned by Flyway (V1), not created at runtime by the application role.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=8h
# Browsers keep cookies apart by host, not by port, so two stacks on one host need different names.
server.servlet.session.cookie.name=${MSE_SESSION_COOKIE:SESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Only the proxy reaches this service; its X-Forwarded-Proto makes the session cookie Secure over HTTPS.
server.forward-headers-strategy=native

# Reject unknown request fields instead of ignoring them.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

# Where plaintext bot tokens are written once, one owner-readable file per bot account, for the simulator.
mse.bots.token-directory=${MSE_BOT_TOKEN_DIRECTORY:${java.io.tmpdir}/mse-bot-tokens}

# The token Market Data sends for the trade export. Blank refuses every export request.
mse.exports.token=${MSE_EXPORT_TOKEN:}

# Trading commands (places and cancels) per second for each account, with up to this many at once. More are
# answered 429 before they reach the writer.
mse.trading.bot-commands-per-second=2
mse.trading.human-commands-per-second=10
# Failed sign-ins: per username, 5 at once and then one every 12 seconds; per client address, 20 and then one
# every 3 seconds. Successful sign-ins don't count.
mse.login.failures-per-user=5
mse.login.user-failure-interval=12s
mse.login.failures-per-address=20
mse.login.address-failure-interval=3s
# Private account streams: a heartbeat (and session check) every 10 seconds, a stuck client dropped after 30, each
# stream ended after 30 minutes for the browser to reopen, and at most 500 in all. An account's sixth replaces its
# oldest, which is most likely a tab already closed.
mse.account-events.heartbeat=10s
mse.account-events.slow-limit=30s
mse.account-events.lifetime=30m
mse.account-events.max-streams=500
mse.account-events.max-per-account=5

# Closing the market cancels every resting order, this many in each transaction: all of them in one would hold the
# writer for one very large commit. The close answers once none rests. With 200,000 resting, the most a market holds,
# that took 25 to 31 seconds when measured, so the request waits 45, under the proxy's 75 for admin routes; past
# that it answers 504, the close goes on, and the same key returns its answer. A transaction that fails is tried three
# times; with the database away each further try waits out the writer pool's 30 second connection wait, so a close
# that gives up does so after the request has: its halt is logged by the writer, and its key is told when sent again.
mse.market.close-chunk-orders=5000
mse.market.close-timeout=45s
# A market opened with a duration is closed by the exchange at its close time. Until that time is nearer than this,
# the schedule wakes this often to compare it with the clock, so a clock set forward is noticed within it; trading is
# refused from the close time on whether or not the close has run.
mse.market.close-check-interval=10s

# The simulator's control credential: its assignment and heartbeat, never trading. Blank refuses it.
mse.simulator.token=${MSE_SIMULATOR_TOKEN:}
# How long a worker's lease lasts without a heartbeat.
mse.simulator.lease=15s

# Blank means the operator's login is not created. Traders are added by the operator during setup; tests may still
# seed one with mse.dev-users.trader-password.
mse.dev-users.operator-password=${DEV_OPERATOR_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
# Outbox relay producer: bounded retries inside one delivery timeout, then the relay backs off and retries the
# same event. A send blocks at most max.block.ms while the broker is unreachable.
spring.kafka.producer.properties[delivery.timeout.ms]=30000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[retry.backoff.ms]=100
spring.kafka.producer.properties[retry.backoff.max.ms]=1000
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[max.in.flight.requests.per.connection]=5
# The relay sends one round of events and waits for it before the next, so waiting to fill a batch only adds latency.
spring.kafka.producer.properties[linger.ms]=0

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Trading readiness: writer ownership held, and the writer running, with or without a market. The reason for DOWN is
# not shown here; the log has it. Of the database checks only the application's pool: the session store's small pool,
# busy under load, must not hold up a probe.
management.endpoint.health.group.readiness.include=readinessState,db/dataSource,trading
