spring.application.name=execution-service
server.port=8080
server.shutdown=graceful

# Runtime connections use the least-privilege role; only Flyway uses the owner role.
spring.datasource.url=${EXECUTION_DB_URL:jdbc:postgresql://localhost:15432/execution_db}
spring.datasource.username=${EXECUTION_DB_APP_USER:execution_app}
spring.datasource.password=${EXECUTION_DB_APP_PASSWORD}
spring.datasource.hikari.pool-name=execution
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${EXECUTION_DB_OWNER_USER:execution_owner}
spring.flyway.password=${EXECUTION_DB_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration

# Session tables are owned by Flyway (V1), not created at runtime by the application role.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Only the proxy reaches this service; its X-Forwarded-Proto makes the session cookie Secure over HTTPS.
server.forward-headers-strategy=native

# Reject unknown request fields instead of ignoring them.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

# Blank means the demo login is not created.
mse.dev-users.operator-password=${DEV_OPERATOR_PASSWORD:}
mse.dev-users.trader-password=${DEV_TRADER_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Trading readiness: writer ownership held, and the writer running once a market exists.
management.endpoint.health.group.readiness.include=readinessState,db,trading
