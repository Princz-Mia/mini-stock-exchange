# Base: Execution, Market Data, proxy/web, PostgreSQL, Kafka.  --profile full adds Flink and the simulator;
# --profile observability adds Prometheus and Grafana. Only the reverse proxy is meant for
# users; every published port binds to localhost. Run `scripts/init-env` first to create .env.
name: mini-stock-exchange

services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env first}
      EXECUTION_DB_OWNER_PASSWORD: ${EXECUTION_DB_OWNER_PASSWORD:?run scripts/init-env first}
      EXECUTION_DB_APP_PASSWORD: ${EXECUTION_DB_APP_PASSWORD:?run scripts/init-env first}
      MARKET_DATA_DB_OWNER_PASSWORD: ${MARKET_DATA_DB_OWNER_PASSWORD:?run scripts/init-env first}
      MARKET_DATA_DB_APP_PASSWORD: ${MARKET_DATA_DB_APP_PASSWORD:?run scripts/init-env first}
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432
    healthcheck:
      # TCP on purpose: the temporary init server listens only on the Unix socket.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0

  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    restart: unless-stopped
    environment:
      CLUSTER_ID: 5oQWh4r8TgqyPz0mXvN3Kw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - 127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0

  kafka-init:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: [bash, /create-topics.sh]
    mem_limit: 512m

  # Kafka is deliberately not a startup dependency of either service: order settlement and durable
  # history must survive a broker outage.
  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EXECUTION_DB_URL: jdbc:postgresql://postgres:5432/execution_db
      EXECUTION_DB_APP_PASSWORD: ${EXECUTION_DB_APP_PASSWORD:?run scripts/init-env first}
      EXECUTION_DB_OWNER_PASSWORD: ${EXECUTION_DB_OWNER_PASSWORD:?run scripts/init-env first}
      DEV_OPERATOR_PASSWORD: ${DEV_OPERATOR_PASSWORD:?run scripts/init-env first}
      DEV_TRADER_PASSWORD: ${DEV_TRADER_PASSWORD:?run scripts/init-env first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MSE_BOT_TOKEN_DIRECTORY: /run/mse/bot-tokens
      # Optional, so an older .env still starts; without it the internal trade export refuses every request.
      MSE_EXPORT_TOKEN: ${MSE_EXPORT_TOKEN:-}
      # Optional too; without it the simulator's control routes refuse every request.
      MSE_SIMULATOR_TOKEN: ${MSE_SIMULATOR_TOKEN:-}
    volumes:
      # Plaintext bot tokens, written once at provisioning; the simulator mounts it read-only.
      - bot-tokens:/run/mse/bot-tokens
    mem_limit: 2g
    cpus: 2.0

  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MARKET_DATA_DB_URL: jdbc:postgresql://postgres:5432/market_data_db
      MARKET_DATA_DB_APP_PASSWORD: ${MARKET_DATA_DB_APP_PASSWORD:?run scripts/init-env first}
      MARKET_DATA_DB_OWNER_PASSWORD: ${MARKET_DATA_DB_OWNER_PASSWORD:?run scripts/init-env first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # For reconciling candles against Execution's trade export; optional, like Execution's side of it.
      EXECUTION_URL: http://execution-service:8080
      MSE_EXPORT_TOKEN: ${MSE_EXPORT_TOKEN:-}
    mem_limit: 1536m
    cpus: 1.5

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WEB_HOST_PORT:-8080}:8080
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  flink-jobmanager:
    profiles: [full]
    build:
      context: .
      dockerfile: analytics-job/Dockerfile
    image: mini-stock-exchange/analytics-job:0.1.0
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    # Resumes from the newest completed checkpoint, so a JobManager restart keeps state and offsets.
    entrypoint: [/opt/flink/bin/mse-jobmanager.sh]
    # FLINK_PROPERTIES takes no comments. The one checkpoint is kept when the job stops, for the next JobManager to
    # resume from (analytics-job/docker/jobmanager.sh).
    environment: &flink-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.rpc.port: 6122
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        state.backend.type: hashmap
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.num-retained: 1
        restart-strategy.type: exponential-delay
        jobmanager.memory.process.size: 1200m
        taskmanager.memory.process.size: 1500m
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    ports:
      - 127.0.0.1:${FLINK_UI_HOST_PORT:-18081}:8081
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:8081/jobs/overview | grep -q '"state":"RUNNING"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1500m
    cpus: 1.0

  flink-taskmanager:
    profiles: [full]
    image: mini-stock-exchange/analytics-job:0.1.0
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_started
    command: taskmanager
    environment: *flink-environment
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: [CMD, bash, -c, "</dev/tcp/127.0.0.1/6122"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1800m
    cpus: 2.0

  simulator:
    profiles: [full]
    build:
      context: ./simulator
    restart: unless-stopped
    environment:
      MSE_EXECUTION_URL: http://execution-service:8080
      MSE_MARKET_DATA_URL: http://market-data-service:8080
      MSE_BOT_TOKEN_DIRECTORY: /run/mse/bot-tokens
      # The control credential for following bot runs; without it the bots stay idle.
      MSE_SIMULATOR_TOKEN: ${MSE_SIMULATOR_TOKEN:-}
    volumes:
      - bot-tokens:/run/mse/bot-tokens:ro
    healthcheck:
      test: [CMD, python, -m, mse_simulator.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:9090/-/ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init-env first}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

volumes:
  bot-tokens:
  postgres-data:
  kafka-data:
  flink-checkpoints:
  prometheus-data:
  grafana-data:
