# Same-origin routing by path to the owning service; no business logic.

# The scheme the client used. A TLS terminator in front says so in X-Forwarded-Proto, and the services need it to
# mark the session cookie Secure; without one in front, this proxy's own scheme. A client claiming https over
# plain HTTP only makes its own cookie one its browser won't send back.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Each service's address is looked up again every few seconds, so either can stop, restart or start later without
# the proxy failing or holding on to a stale address.
resolver 127.0.0.11 valid=5s ipv6=off;

# Connections to the services are kept open and reused. Opening one per request would leave each closed one in
# TIME_WAIT for a minute, and the container's 28,000 or so local ports would run out near 470 requests a second.
# Idle ones close after 30 s, before the services' own 60 s, so an idle close never races a request. A service shutting
# down answers requests on open connections with 503, then closes them.
upstream execution {
    zone execution 64k;
    server execution-service:8080 resolve;
    keepalive 64;
    keepalive_timeout 30s;
}

upstream market_data {
    zone market_data 64k;
    server market-data-service:8080 resolve;
    keepalive 32;
    keepalive_timeout 30s;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Fail fast: a stopped container can leave a stale address that never answers.
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The address this proxy saw, replacing any the client sent: the services limit failed sign-ins per address,
    # and an appended header would let a client name its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    # Security headers on every response, errors included. The app is one origin: its own scripts, styles and
    # API, no inline script, never framed. The services' own copies of two of these are dropped so each header
    # appears once.
    server_tokens off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events: no buffering, and idle timeouts above the 10-second heartbeat.
    location = /api/v1/market-events {
        proxy_pass http://market_data;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /api/v1/account-events {
        proxy_pass http://execution;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/v1/instruments(/|$) {
        proxy_pass http://market_data;
    }

    location ~ ^/api/v1/(auth|orders|portfolio|commands|admin|me)(/|$) {
        proxy_pass http://execution;
    }

    location = /api/v1/market {
        proxy_pass http://execution;
    }

    # Unknown API paths, including /api/v1/internal/*, stay off the public origin. Internal callers
    # reach Execution directly on the Compose network.
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
