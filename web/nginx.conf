# Same-origin routing by path to the owning service; no business logic.
# Upstreams are variables so nginx resolves them per request: either service can stop, restart
# or start later without the proxy failing or holding on to a stale address.

# The scheme the client used. A TLS terminator in front says so in X-Forwarded-Proto, and the services need it to
# mark the session cookie Secure; without one in front, this proxy's own scheme. A client claiming https over
# plain HTTP only makes its own cookie one its browser won't send back.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $execution http://execution-service:8080;
    set $market_data http://market-data-service:8080;

    # Fail fast: a stopped container can leave a stale address that never answers.
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The address this proxy saw, replacing any the client sent: the services limit failed sign-ins per address,
    # and an appended header would let a client name its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    # Security headers on every response, errors included. The app is one origin: its own scripts, styles and
    # API, no inline script, never framed. The services' own copies of two of these are dropped so each header
    # appears once.
    server_tokens off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events: no buffering, and idle timeouts above the 10-second heartbeat.
    location = /api/v1/market-events {
        proxy_pass $market_data;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /api/v1/account-events {
        proxy_pass $execution;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/v1/instruments(/|$) {
        proxy_pass $market_data;
    }

    location ~ ^/api/v1/(auth|orders|portfolio|commands|admin)(/|$) {
        proxy_pass $execution;
    }

    location ~ ^/api/v1/(me|market)$ {
        proxy_pass $execution;
    }

    # Unknown API paths, including /api/v1/internal/*, stay off the public origin. Internal callers
    # reach Execution directly on the Compose network.
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
