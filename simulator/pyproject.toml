[project]
name = "mse-simulator"
version = "0.1.0"
description = "Bot simulator for the Mini Stock Exchange"
requires-python = "==3.14.10"
dependencies = [
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pydantic==2.14.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mse_simulator"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
