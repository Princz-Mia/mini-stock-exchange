      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotRunStarted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_NOT_OPEN, MARKET_CLOSED (final: no run starts in a closed market) or RUN_ACTIVE (committed and
            audited once a market exists), or IDEMPOTENCY_CONFLICT.
