            application/json:
              schema: { $ref: '#/components/schemas/BotRunList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator. No body.
    post:
      tags: [execution]
      operationId: startBotRun
      summary: Start a bot run while the market is open or halted. One run runs at a time.
      description: |
        Operator only, with an idempotency key; sequenced on the writer and audited. Each strategy is run by the
        oldest bots tagged with it; untagged bots are never assigned. Without a seed one is chosen; without
        instrumentIds the bots trade every listed instrument; without durationMinutes the run lasts until stopped.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
