  /api/v1/admin/market/close:
    post:
      tags: [execution]
      operationId: closeMarket
      summary: Close the market for good. Every resting order is canceled and every bot run ends.
      description: |
        Operator only. Sequenced on the writer and audited, and needs an idempotency key: a retry with the same
        key returns the first answer, even a refusal. Allowed from OPEN and from HALTED. CLOSED is final: no
        transition leads out of it, and a market still in SETUP is not closed.

        From this command's sequence on, an order is rejected with MARKET_CLOSED and no bot run starts. In the
        same transaction every bot run that has not ended ends (endedBy MARKET_CLOSE), every bot token is revoked,
        and each instrument's last snapshot says CLOSED. Every resting order is canceled with the reason
        MARKET_CLOSED and its hold released: the first of them with the close, the rest in further transactions,
        each with a command sequence of its own, before any other command runs. Nothing is deleted: portfolios,
        orders, trades, accounts and runs stay readable.

        The answer comes once no order rests. A close with very many resting orders can take longer than the
        request waits; it then answers 504 and goes on. No lookup by key serves a close, since
        /api/v1/commands/{key} answers for orders and cancels only: send the same key again, which waits for the
        close and returns its answer.

        A close is never left half done by a running exchange. If one of the later transactions fails, it is tried
        again; if the orders still cannot all be canceled, trading stops and the answer is 503
        MARKET_CLOSE_UNFINISHED. The request gets that answer if it is still waiting, and so does every close sent
        from then until the exchange restarts, so a key that was answered 504 finds out as well. The market is
        CLOSED by then, so nothing is to be sent again: the exchange cancels the orders that still rest when it
        restarts, before it takes any command, and the key that closed the market then returns the close's answer.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Applied. The market is CLOSED from this command's sequence on, and no order rests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketClosed' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_TRANSITION_NOT_ALLOWED (committed and audited, with the market's current state: SETUP, or
            CLOSED for a market closed before), MARKET_NOT_SET_UP (nothing committed), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            EXCHANGE_BUSY (not queued; retry with the same key), TRADING_UNAVAILABLE, or MARKET_CLOSE_UNFINISHED:
            the close committed, so the market is CLOSED, its bot runs have ended and its bot tokens are revoked,
            but not every resting order could be canceled, and trading has stopped. The problem carries state
            (CLOSED), the close's commandSequence, restingOrders and this request's commandKey. restingOrders is
            an upper bound: the exchange's own count when trading stopped, and a transaction whose outcome it
            could not learn may have canceled some of them already. Every close is answered this way until the
            exchange restarts, which finishes the close. EXCHANGE_BUSY and TRADING_UNAVAILABLE have Retry-After;
            MARKET_CLOSE_UNFINISHED has none, since nothing is to be sent again.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: |
            COMMAND_OUTCOME_UNKNOWN. The close did not answer in time and may still be going on. Not to be looked
            up by commandKey, which no route does for a close: send the same key again. It returns the close's
            answer once the close is done, or 503 MARKET_CLOSE_UNFINISHED if trading stopped for it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/exports/trades:
    get:
      tags: [execution]
      operationId: exportTrades
      summary: Every trade of one instrument in sequence order, for rebuilding and checking projections.
      description: |
        Internal: the proxy never forwards it. Needs the service token as a bearer credential; no session, bot token
        or CSRF token is accepted. The first page captures the instrument's newest trade sequence as throughSequence;
        pass it back with each cursor to page through that fixed set. No order, account or owner appears.
      parameters:
        - name: instrumentId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: throughSequence
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: cursor
          in: query
          description: The nextCursor of the previous page. Opaque.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeExport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No valid service token. No body.
        '404': { $ref: '#/components/responses/Problem' }

  /internal/simulator/assignment:
    get:
      tags: [execution]
      operationId: simulatorAssignment
      summary: The bot run the simulator should work on, with its instruments and how many bots it has.
      description: |
        Internal: the proxy never forwards it. Needs the simulator token, which can't trade. A run a worker left
        without confirming its stop comes first, then the run that should be running; run is null when there is
        neither. The run's bots are read from its bot pages, since a run has no size limit.
      responses:
        '200':
          description: The assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorAssignment' }
        '401':
          description: No valid simulator token. No body.
        '403':
          description: Another service's token. No body.

  /internal/simulator/runs/{runId}/bots:
    get:
      tags: [execution]
      operationId: simulatorRunBots
      summary: A page of a bot run's bots, oldest first.
      description: |
        Internal, with the simulator token. A run's bots never change once it starts, so a worker reads every page
        once, until nextCursor is null, and has as many bots as the assignment's botCount. Each names its credential
        file in the simulator's token directory, never a token. A cursor belongs to its run and is refused for
        another.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorBotPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No valid simulator token. No body.
        '403':
          description: Another service's token. No body.
        '404':
          description: RUN_NOT_FOUND.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/simulator/heartbeat:
    post:
      tags: [execution]
      operationId: simulatorHeartbeat
      summary: Take or renew a run's worker lease, report cumulative totals, or confirm a stop.
      description: |
        Internal, with the simulator token. One worker holds a run at a time; the lease is taken when free, its own
        or lapsed. Totals are cumulative for the run, so a retry changes nothing. Once desiredState is STOPPED, the
        worker settles what is in flight, cancels its quotes, and confirms with stopped, which releases the lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatorHeartbeatRequest' }
      responses:
        '200':
          description: Lease held, or stop confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorHeartbeat' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No valid simulator token. No body.
        '403':
          description: Another service's token. No body.
        '404':
          description: RUN_NOT_FOUND.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: LEASE_HELD by another worker, RUN_FINISHED, or RUN_NOT_STOPPING for a stop the run hasn't been asked for.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/instruments:
    get:
      tags: [market-data]
