openapi: 3.1.0
info:
  title: Mini Stock Exchange API
  version: 1.0.0
  description: |
    The public HTTP API, served under one origin. Each operation is tagged with the service that owns it;
    the reverse proxy routes by path.

    Conventions:
    - Prices are decimal strings with exactly two places, such as "100.25".
    - Sequences are strings, because they are 64-bit and JavaScript loses precision above 2^53.
    - Times are UTC ISO-8601.
    - Errors are RFC 9457 problem details. Every error the application raises carries a stable `code`;
      errors produced by the framework for malformed requests may not.
    - Mutating requests need the session cookie and the CSRF token in the header named by GET /auth/csrf.
    - Bots send `Authorization: Bearer <token>` instead, on the order, command and portfolio routes only. A
      request with a bearer token is judged by that token alone: no session cookie and no CSRF token are used,
      and an invalid token gets 401.
    - `x-may-be-empty: true` on a response means it can also come with no body, when the security layer
      refuses the request before the application sees it.

servers:
  - url: /

tags:
  - name: execution
    description: Identity, orders and command results. Owned by the execution service.
  - name: market-data
    description: Public market data and the live stream. Owned by the market data service.

paths:
  /api/v1/auth/csrf:
    get:
      tags: [execution]
      operationId: getCsrfToken
      summary: The CSRF token for this session, to send in the named header on every mutating request.
      responses:
        '200':
          description: The token and the header to send it in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }

  /api/v1/auth/login:
    post:
      tags: [execution]
      operationId: login
      summary: Start a session. Rotates the session id and the CSRF token, so fetch a new token afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: Wrong password or unknown user; both get the same answer, code INVALID_CREDENTIALS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Missing or invalid CSRF token. No body.
        '429':
          description: |
            LOGIN_RATE_LIMITED: too many failed sign-ins for this username or from this address (5 at once then
            one every 12 seconds per username, 20 then one every 3 seconds per address, by default). The password
            was not checked. Try again after Retry-After.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/logout:
    post:
      tags: [execution]
      operationId: logout
      summary: End the session.
      responses:
        '204':
          description: Logged out.
        '403':
          description: Missing or invalid CSRF token. No body.

  /api/v1/me:
    get:
      tags: [execution]
      operationId: getIdentity
      summary: Who the session belongs to.
      responses:
        '200':
          description: The logged-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '401':
          description: No session. No body.

  /api/v1/me/tour:
    get:
      tags: [execution]
      operationId: getTourSeen
      summary: The newest version of the first-login tour this user has seen; 0 if none.
      responses:
        '200':
          description: The version seen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourSeen' }
        '401':
          description: No session. No body.
    put:
      tags: [execution]
      operationId: putTourSeen
      summary: Record a tour version as seen. The stored version only rises; the answer is the version now stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourSeenRequest' }
      responses:
        '200':
          description: The version now stored, which is never lower than before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourSeen' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Missing or invalid CSRF token. No body.

  /api/v1/orders:
    get:
      tags: [execution]
      operationId: listOrders
      summary: The caller's own orders, newest first unless order=oldest.
      description: |
        With status=active, every open or partially filled order, at most 20, in one response. With status=all,
        every order including rejected ones, in keyset pages. With status=finished, the filled, canceled and
        rejected orders that ended most recently, most recent first, in one page of at most limit; it takes no
        cursor or order. The instrumentId and side filters apply to status=all and status=finished, state to
        status=all only; filters are refused with status=active.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, active, finished], default: all }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/FilterInstrument'
        - $ref: '#/components/parameters/FilterSide'
        - name: state
          in: query
          description: Only orders in this state.
          schema: { type: string, enum: [OPEN, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED] }
      responses:
        '200':
          description: One page of orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          $ref: '#/components/responses/NotTrader'
    post:
      tags: [execution]
      operationId: placeOrder
      summary: Place an order for the logged-in trader's account.
      description: |
        The account always comes from the session. The same Idempotency-Key with the same request returns the
        first committed answer, with the same status; with a different request it is a conflict.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '201':
          description: Accepted and committed. The order may be open, filled, or canceled (an IOC remainder).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: |
            Not a trader or missing CSRF token, refused before the controller with no body; or NO_TRADING_ACCOUNT.
          x-may-be-empty: true
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: |
            Rejected and committed, with the reason as code: INSUFFICIENT_CASH, INSUFFICIENT_SHARES,
            MARKET_NOT_OPEN, ORDER_LIMIT_EXCEEDED, EXECUTION_LIMIT_EXCEEDED; plus orderId and commandSequence.
            UNKNOWN_INSTRUMENT is not committed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/orders/{orderId}:
    get:
      tags: [execution]
      operationId: getOrder
      summary: One of the caller's own orders. Another account's order is indistinguishable from a missing one.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401':
          description: No session. No body.
        '403':
          description: Not a trader.
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [execution]
      operationId: cancelOrder
      summary: Cancel one of the caller's resting orders.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Canceled now, or already canceled before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cancellation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: |
            Not a trader or missing CSRF token, refused before the controller with no body; or NO_TRADING_ACCOUNT.
          x-may-be-empty: true
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: ORDER_NOT_CANCELABLE (filled or rejected), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/commands/{key}:
    get:
      tags: [execution]
      operationId: getCommand
      summary: The first committed answer for one of the caller's idempotency keys, with its original status.
      description: 404 means nothing committed under the key, so retrying the original request with it is safe.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A cancel's answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cancellation' }
        '201':
          description: A placement's answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: No session. No body.
        '403':
          description: Not a trader.
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /api/v1/portfolio:
    get:
      tags: [execution]
      operationId: getPortfolio
      summary: The caller's cash, holdings and estimated equity, all from one consistent read.
      description: |
        Cash and holdings come from the same committed state. Each holding is marked to the instrument's latest
        execution, or to its labelled reference price before the first trade.
      responses:
        '200':
          description: The portfolio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '401':
          description: No session. No body.
        '403':
          $ref: '#/components/responses/NotTrader'

  /api/v1/portfolio/trades:
    get:
      tags: [execution]
      operationId: listOwnTrades
      summary: The caller's own executions, newest first unless order=oldest, in keyset pages.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/FilterInstrument'
        - $ref: '#/components/parameters/FilterSide'
      responses:
        '200':
          description: One page of executions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnTradePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          $ref: '#/components/responses/NotTrader'

  /api/v1/market:
    get:
      tags: [execution]
      operationId: getMarket
      summary: The authoritative trading phase. Public.
      description: |
        Read from the committed market, so it is never behind the writer. A venue state shown by market data
        can lag behind this.
      responses:
        '200':
          description: The phase, or NOT_SET_UP with null fields before a market exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketStatus' }

  /api/v1/admin/instruments:
    post:
      tags: [execution]
      operationId: addInstrument
      summary: Add an instrument while the market is in SETUP. The first one creates the market.
      description: |
        Operator only. Sequenced on the writer and audited, with an idempotency key: a retry with the same key and
        body returns the first answer, even a refusal. Publishes the instrument's first market snapshot.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_NOT_IN_SETUP or SYMBOL_TAKEN (both committed and audited), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/instruments/{instrumentId}:
    put:
      tags: [execution]
      operationId: editInstrument
      summary: Change an instrument's reference price while the market is in SETUP.
      description: |
        Operator only. The body holds every field an operator may change. Sequenced on the writer and audited, with an
        idempotency key: a retry with the same key, instrument and body returns the first answer, even a refusal. The
        same price is applied like any other. Publishes the instrument's market snapshot with the new price. Starting
        shares already granted are valued at the new price. Once the market has opened, the catalogue is frozen.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: instrumentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentEditRequest' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentEdited' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '404':
          description: INSTRUMENT_NOT_FOUND (committed and audited when the market exists).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: MARKET_NOT_IN_SETUP (committed and audited), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'
    delete:
      tags: [execution]
      operationId: deleteInstrument
      summary: Delete an instrument nothing uses while the market is in SETUP.
      description: |
        Operator only. Sequenced on the writer and audited, with an idempotency key: a retry with the same key and
        instrument returns the first answer, even a refusal. Refused while anything refers to the instrument: an
        account given its shares, or an order sent for it, even one refused because the market was not open. Giving
        shares back would need compensating ledger entries, so an instrument in use stays. Publishes the instrument's
        last market snapshot, marked removed. The symbol can be added again, under a new id. Once the market has
        opened, the catalogue is frozen.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: instrumentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentDeleted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '404':
          description: INSTRUMENT_NOT_FOUND (committed and audited when the market exists).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            MARKET_NOT_IN_SETUP or INSTRUMENT_IN_USE (both committed and audited), or IDEMPOTENCY_CONFLICT.
            INSTRUMENT_IN_USE carries usage: who holds the instrument and how many orders name it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/accounts:
    get:
      tags: [execution]
      operationId: listAccounts
      summary: Every trading account with what it started with, oldest first unless order=newest. Operator only.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator. No body.
    post:
      tags: [execution]
      operationId: provisionAccount
      summary: Give a trader their account and starting endowment while the market is in SETUP.
      description: |
        Operator only. Sequenced on the writer and audited, with an idempotency key: a retry with the same key and
        body returns the first answer, even a refusal. The endowment comes from the issuance account in one balanced
        genesis batch and is recorded as the account's initial allocation. Nothing is granted after opening.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequest' }
      responses:
        '201':
          description: Created and funded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_NOT_IN_SETUP or ACCOUNT_EXISTS (both committed and audited), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            UNKNOWN_INSTRUMENT (committed and audited), or UNKNOWN_TRADER (no trader with that username; nothing
            committed).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/bots:
    get:
      tags: [execution]
      operationId: getBotPopulation
      summary: How many bots exist and the limits on making more. Operator only.
      responses:
        '200':
          description: The population and its limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotPopulation' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator. No body.
    post:
      tags: [execution]
      operationId: provisionBots
      summary: Create funded bot accounts, each with its own API token, while the market is in SETUP.
      description: |
        Operator only. Sequenced on the writer and audited, with an idempotency key: a retry with the same key and
        body returns the first answer, even a refusal. Bots are named bot-0001, bot-0002 and so on, in the order
        they are created, and each gets the same endowment in its own genesis batch. Each token is written once to
        the simulator's secret directory; no response ever contains a token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BotsRequest' }
      responses:
        '201':
          description: Created and funded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotsCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_NOT_IN_SETUP or BOT_POPULATION_LIMIT (both committed and audited), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: UNKNOWN_INSTRUMENT (committed and audited).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/bots/{accountId}/revoke-token:
    post:
      tags: [execution]
      operationId: revokeBotToken
      summary: Revoke a bot's token, so its next request is refused. Works in any market state.
      description: |
        Operator only. Sequenced on the writer and audited, with an idempotency key. The bot's orders and balances
        are untouched. Revoking again revokes nothing: revoked is 0. A revoked token stays revoked.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: accountId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Revoked, or already revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenRevoked' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '404':
          description: BOT_NOT_FOUND (committed and audited when the market exists).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/health:
    get:
      tags: [execution]
      operationId: getHealthSummary
      summary: How trading is keeping up, for the operator's health panel. Operator only.
      description: |
        The writer and its queue, the trading commands of the last sixty seconds, and the publication outbox, read
        in-process. withinBudget counts the finished commands that took 150 ms or less from admission to result.
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthSummary' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator. No body.

  /api/v1/admin/bot-runs:
    get:
      tags: [execution]
      operationId: listBotRuns
      summary: Bot runs with their configuration, worker and activity, newest first unless order=oldest. Operator only.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotRunList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator. No body.
    post:
      tags: [execution]
      operationId: startBotRun
      summary: Start a bot run while the market is open or halted. One run runs at a time.
      description: |
        Operator only, with an idempotency key; sequenced on the writer and audited. Bot accounts are assigned in
        creation order: market makers first, then noise, then momentum. Without a seed one is chosen; without
        instrumentIds the bots trade every listed instrument; without durationMinutes the run lasts until stopped.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BotRunRequest' }
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotRunStarted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: MARKET_NOT_OPEN or RUN_ACTIVE (committed and audited once a market exists), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: NOT_ENOUGH_BOTS or UNKNOWN_INSTRUMENT (committed and audited).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/bot-runs/{runId}/stop:
    post:
      tags: [execution]
      operationId: stopBotRun
      summary: Ask a running bot run to stop.
      description: |
        Operator only, with an idempotency key; sequenced and audited. The worker stops placing orders, settles
        what is in flight and cancels its quotes, then confirms; until then the run shows STOPPING.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stop requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotRunStopping' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '404':
          description: RUN_NOT_FOUND (committed and audited).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: RUN_NOT_RUNNING or MARKET_NOT_OPEN, or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/market/open:
    post:
      tags: [execution]
      operationId: openMarket
      summary: Open the market for trading, once.
      description: |
        Operator only. Sequenced on the writer and audited, and needs an idempotency key: a retry with the same
        key returns the first answer, even a refusal. Allowed only from SETUP.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Applied. The market is OPEN from this command's sequence on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTransition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_TRANSITION_NOT_ALLOWED (committed and audited, with the market's current state),
            MARKET_NOT_SET_UP (nothing committed), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/market/halt:
    post:
      tags: [execution]
      operationId: haltMarket
      summary: Halt trading. New orders are rejected; cancels still work.
      description: |
        Operator only. Sequenced on the writer and audited, and needs an idempotency key: a retry with the same
        key returns the first answer, even a refusal. Allowed only from OPEN.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Applied. The market is HALTED from this command's sequence on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTransition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_TRANSITION_NOT_ALLOWED (committed and audited, with the market's current state),
            MARKET_NOT_SET_UP (nothing committed), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /api/v1/admin/market/resume:
    post:
      tags: [execution]
      operationId: resumeMarket
      summary: Resume trading. Resting orders keep their priority.
      description: |
        Operator only. Sequenced on the writer and audited, and needs an idempotency key: a retry with the same
        key returns the first answer, even a refusal. Allowed only from HALTED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Applied. The market is OPEN from this command's sequence on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTransition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No session. No body.
        '403':
          description: Not an operator, or missing CSRF token. No body.
        '409':
          description: |
            MARKET_TRANSITION_NOT_ALLOWED (committed and audited, with the market's current state),
            MARKET_NOT_SET_UP (nothing committed), or IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/OutcomeUnknown'

  /internal/exports/trades:
    get:
      tags: [execution]
      operationId: exportTrades
      summary: Every trade of one instrument in sequence order, for rebuilding and checking projections.
      description: |
        Internal: the proxy never forwards it. Needs the service token as a bearer credential; no session, bot token
        or CSRF token is accepted. The first page captures the instrument's newest trade sequence as throughSequence;
        pass it back with each cursor to page through that fixed set. No order, account or owner appears.
      parameters:
        - name: instrumentId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: throughSequence
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: cursor
          in: query
          description: The nextCursor of the previous page. Opaque.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeExport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No valid service token. No body.
        '404': { $ref: '#/components/responses/Problem' }

  /internal/simulator/assignment:
    get:
      tags: [execution]
      operationId: simulatorAssignment
      summary: The bot run the simulator should work on, with its bots and instruments.
      description: |
        Internal: the proxy never forwards it. Needs the simulator token, which can't trade. A run a worker left
        without confirming its stop comes first, then the run that should be running; run is null when there is
        neither. Bots name their credential file in the simulator's token directory, never a token.
      responses:
        '200':
          description: The assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorAssignment' }
        '401':
          description: No valid simulator token. No body.
        '403':
          description: Another service's token. No body.

  /internal/simulator/heartbeat:
    post:
      tags: [execution]
      operationId: simulatorHeartbeat
      summary: Take or renew a run's worker lease, report cumulative totals, or confirm a stop.
      description: |
        Internal, with the simulator token. One worker holds a run at a time; the lease is taken when free, its own
        or lapsed. Totals are cumulative for the run, so a retry changes nothing. Once desiredState is STOPPED, the
        worker settles what is in flight, cancels its quotes, and confirms with stopped, which releases the lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatorHeartbeatRequest' }
      responses:
        '200':
          description: Lease held, or stop confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorHeartbeat' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: No valid simulator token. No body.
        '403':
          description: Another service's token. No body.
        '404':
          description: RUN_NOT_FOUND.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: LEASE_HELD by another worker, RUN_FINISHED, or RUN_NOT_STOPPING for a stop the run hasn't been asked for.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/instruments:
    get:
      tags: [market-data]
      operationId: listInstruments
      summary: Every instrument with its rules, quotes and how current the data is.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instruments' }

  /api/v1/instruments/{instrumentId}/book:
    get:
      tags: [market-data]
      operationId: getBook
      summary: Aggregate depth per side, best first.
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/instruments/{instrumentId}/trades:
    get:
      tags: [market-data]
      operationId: listTrades
      summary: The public tape, newest first, in keyset pages.
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: The nextCursor of the previous page. Opaque.
          schema: { type: string }
      responses:
        '200':
          description: One page of trades.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trades' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/instruments/{instrumentId}/candles:
    get:
      tags: [market-data]
      operationId: listCandles
      summary: One-minute bars for a time range, oldest first, with how current the analytics are.
      description: |
        Bars with from <= bucketStart < to, at most 1,440 minutes per request. Without from and to, the last two
        hours. A minute without trades has no bar. Bars come from the computation epoch this instance serves.
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: from
          in: query
          schema: { $ref: '#/components/schemas/Timestamp' }
        - name: to
          in: query
          description: Exclusive.
          schema: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: The bars and their freshness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candles' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/reconciliation/candles:
    get:
      tags: [market-data]
      operationId: reconcileCandles
      summary: Checks one epoch's stored candles against Execution's trade export, exactly.
      description: |
        Internal: the proxy never forwards it. For every instrument with a snapshot, or one, each candle is
        recomputed from the exported trades up to its own source trade sequence and compared field by field.
        Candles that are behind still reconcile; what they cover must match.
      parameters:
        - name: instrumentId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: epoch
          in: query
          description: The computation epoch to check; the served one by default.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: The result for each instrument.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandleReconciliation' }
        '400': { $ref: '#/components/responses/Problem' }
        '503':
          description: EXPORT_UNAVAILABLE. The export is not configured or cannot be read.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/market-events:
    get:
      tags: [market-data]
      operationId: streamMarket
      summary: Live market for one instrument, as server-sent events.
      description: |
        Event `market` carries a MarketFrame: the complete public state, first on connecting and then at most
        four times a second after committed changes. Each frame replaces the previous one. Event `heartbeat`
        carries a Heartbeat after 10 seconds without a frame. A new bootId means the service restarted.
      parameters:
        - name: instrumentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stream. Each event's data is JSON, a MarketFrame or a Heartbeat.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503':
          description: TOO_MANY_STREAMS. Retry after the Retry-After header.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/account-events:
    get:
      tags: [execution]
      operationId: streamAccount
      summary: The signed-in trader's own change notifications, as server-sent events.
      description: |
        Event `account` carries an AccountFrame: only the account's version, the command sequence of its latest
        change since the service started (0 before any). It comes first on connecting, then after each committed
        command that changed the account: an order placed, rejected, filled (as either side) or cancelled. On each,
        read orders and portfolio from the REST API again; frames carry no private data. Event `heartbeat`
        carries an AccountHeartbeat after 10 seconds without a frame. A trader's session only, never a bot token;
        the stream ends when the session does, at once on logout and within a heartbeat on expiry.
      responses:
        '200':
          description: The stream. Each event's data is JSON, an AccountFrame or an AccountHeartbeat.
          content:
            text/event-stream:
              schema: { type: string }
        '401':
          description: No session. No body.
        '403':
          description: Not a trader, or a bot token. No body, or NO_TRADING_ACCOUNT.
        '503':
          description: |
            TOO_MANY_STREAMS in all. Retry after the Retry-After header. An account's sixth stream is not refused:
            it replaces the account's oldest, which then ends.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-chosen UUID, kept for retries of the same request.
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: |
        The nextCursor of the previous page. Opaque. Refused under an order or filters other than the ones it came
        from.
      schema: { type: string }
    FilterInstrument:
      name: instrumentId
      in: query
      description: Only this instrument's rows.
      schema: { type: string, format: uuid }
    FilterSide:
      name: side
      in: query
      description: Only buys, or only sells.
      schema: { type: string, enum: [BUY, SELL] }
    Order:
      name: order
      in: query
      description: Which end of the list pages start from. Without it, the operation's own default, named in its summary.
      schema: { type: string, enum: [newest, oldest] }

  responses:
    NotTrader:
      description: Not a trader, refused before the controller with no body; or NO_TRADING_ACCOUNT.
      x-may-be-empty: true
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: A problem, with its code.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: |
        RATE_LIMITED: the account sent more trading commands per second than it may (10 for a person, 2 for a
        bot, by default). Nothing was queued, so the same key is safe to send again after Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: EXCHANGE_BUSY (not queued; retry with the same key), or TRADING_UNAVAILABLE. Has Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OutcomeUnknown:
      description: COMMAND_OUTCOME_UNKNOWN. The command may still commit; look it up by commandKey.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Price:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})\.[0-9]{2}$'
      examples: ['100.25']
    SignedAmount:
      type: string
      description: A decimal with exactly two places and a minus sign when negative; no plus sign.
      pattern: '^-?(0|[1-9][0-9]{0,18})\.[0-9]{2}$'
      examples: ['1.03', '-0.50', '0.00']
    Sequence:
      type: string
      pattern: '^[0-9]+$'
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time

    Problem:
      type: object
      required: [status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable reason. Set on every error the application raises.
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
        commandKey: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        usage: { $ref: '#/components/schemas/InstrumentUsage' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    CsrfToken:
      type: object
      additionalProperties: false
      required: [headerName, token]
      properties:
        headerName: { type: string }
        token: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200 }
    Identity:
      type: object
      additionalProperties: false
      required: [username, roles]
      properties:
        username: { type: string }
        roles:
          type: array
          items: { type: string, enum: [TRADER, OPERATOR] }

    TourSeen:
      type: object
      additionalProperties: false
      required: [seenVersion]
      properties:
        seenVersion: { type: integer, minimum: 0, maximum: 1000 }

    TourSeenRequest:
      type: object
      additionalProperties: false
      required: [seenVersion]
      properties:
        seenVersion: { type: integer, minimum: 1, maximum: 1000 }

    OrderRequest:
      type: object
      additionalProperties: false
      description: LIMIT goes with GTC and limitPrice; MARKET_PROTECTED with IOC and protectionPrice.
      required: [instrumentId, side, type, timeInForce, quantity]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        side: { $ref: '#/components/schemas/Side' }
        type: { type: string, enum: [LIMIT, MARKET_PROTECTED] }
        timeInForce: { type: string, enum: [GTC, IOC] }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        limitPrice: { $ref: '#/components/schemas/Price' }
        protectionPrice: { $ref: '#/components/schemas/Price' }
    Side:
      type: string
      enum: [BUY, SELL]
    Order:
      type: object
      additionalProperties: false
      required: [orderId, state, reason, filledQuantity, workingQuantity, canceledQuantity, commandSequence]
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        state: { type: string, enum: [OPEN, PARTIALLY_FILLED, FILLED, CANCELED] }
        reason:
          type: [string, 'null']
          description: Why an IOC remainder was canceled, such as IOC_REMAINDER_CANCELED.
        filledQuantity: { type: integer, format: int64 }
        workingQuantity: { type: integer, format: int64 }
        canceledQuantity: { type: integer, format: int64 }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    OrderDetail:
      type: object
      additionalProperties: false
      required: [orderId, instrumentId, symbol, side, type, timeInForce, limitPrice, protectionPrice,
        requestedQuantity, filledQuantity, workingQuantity, canceledQuantity, state, reason, version, createdAt,
        updatedAt]
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/Side' }
        type: { type: string, enum: [LIMIT, MARKET_PROTECTED] }
        timeInForce: { type: string, enum: [GTC, IOC] }
        limitPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        protectionPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        requestedQuantity: { type: integer, format: int64 }
        filledQuantity: { type: integer, format: int64 }
        workingQuantity: { type: integer, format: int64 }
        canceledQuantity: { type: integer, format: int64 }
        state: { type: string, enum: [OPEN, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED] }
        reason: { type: [string, 'null'] }
        version:
          $ref: '#/components/schemas/Sequence'
          description: Increases with every change to the order.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    OrderPage:
      type: object
      additionalProperties: false
      required: [orders, nextCursor]
      properties:
        orders:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/OrderDetail' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page, and always null for status=active.
    Money:
      type: string
      description: An amount with exactly two decimals, such as "12345.67".
      pattern: '^-?(0|[1-9][0-9]{0,18})\.[0-9]{2}$'
    Portfolio:
      type: object
      additionalProperties: false
      required: [cash, holdings, equity, accountVersion, asOfCommandSequence, costBasis, unrealized, unrealizedPercent]
      properties:
        cash: { $ref: '#/components/schemas/Cash' }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Holding' }
        equity:
          $ref: '#/components/schemas/Money'
          description: Total cash plus every holding at its mark; reserved amounts are counted once.
        accountVersion:
          $ref: '#/components/schemas/Sequence'
          description: Increases with every command that changes this account's money or orders.
        asOfCommandSequence:
          $ref: '#/components/schemas/Sequence'
          description: The last command reflected here.
        costBasis:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
          description: |
            Estimated: what the shares held cost by the average-cost rule (Holding.averageCost), totalled; 0.00 with
            no shares. Null for a bot's read, and when any holding with shares has a null averageCost.
        unrealized:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: Estimated, the holdings' value less their cost, totalled. Null when costBasis is.
        unrealizedPercent:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: unrealized as a percentage of costBasis, rounded half-even to two places. Null when costBasis is.
    Cash:
      type: object
      additionalProperties: false
      required: [total, available, reserved]
      properties:
        total: { $ref: '#/components/schemas/Money' }
        available: { $ref: '#/components/schemas/Money' }
        reserved: { $ref: '#/components/schemas/Money' }
    Holding:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, total, available, reserved, mark, value, changePercent, weight, averageCost,
        unrealized, unrealizedPercent]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        total: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        mark: { $ref: '#/components/schemas/Mark' }
        value:
          $ref: '#/components/schemas/Money'
          description: total at the mark.
        changePercent:
          $ref: '#/components/schemas/SignedAmount'
          description: The mark against the instrument's reference price, in percent, rounded half-even to two places.
        weight:
          $ref: '#/components/schemas/Price'
          description: value as a percentage of equity, rounded half-even to two places; 0.00 when equity is zero.
        averageCost:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
          description: |
            Estimated, not a tax-style cost basis: the cost of one share by the average-cost rule, from the account's
            own trades in sequence order, with starting shares at their reference price. A buy averages in at its
            price; a sale leaves the average alone; selling out resets it. Rounded half-even to the cent. Worked out
            from every trade of the account on each read, so it is null for a bot's read. Also null with no shares
            held, and when the account's history does not account for exactly the shares held, rather than wrong.
        unrealized:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: |
            Estimated, value less the shares' cost by the same rule, rounded half-even to the cent. Null when
            averageCost is.
        unrealizedPercent:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: |
            unrealized as a percentage of the shares' cost, rounded half-even to two places. Null when averageCost
            is.
    Mark:
      type: object
      additionalProperties: false
      required: [price, source, at]
      properties:
        price: { $ref: '#/components/schemas/Price' }
        source:
          type: string
          enum: [LAST_TRADE, REFERENCE]
          description: REFERENCE before the instrument's first trade; label it as such.
        at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
          description: When the last trade happened; null for a reference price.
    OwnTrade:
      type: object
      additionalProperties: false
      required: [tradeId, instrumentId, symbol, side, liquidity, price, quantity, notional, executedAt,
        commandSequence]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        side:
          $ref: '#/components/schemas/Side'
          description: The caller's side of the trade.
        liquidity:
          type: string
          enum: [MAKER, TAKER]
          description: MAKER when the caller's order was resting, TAKER when it arrived.
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        notional: { $ref: '#/components/schemas/Money' }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    OwnTradePage:
      type: object
      additionalProperties: false
      required: [trades, nextCursor]
      properties:
        trades:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/OwnTrade' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    Cancellation:
      type: object
      additionalProperties: false
      required: [orderId, status, canceledQuantity, commandSequence]
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [CANCELED, ALREADY_CANCELED] }
        canceledQuantity: { type: integer, format: int64 }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    InstrumentRequest:
      type: object
      additionalProperties: false
      required: [symbol, referencePrice]
      properties:
        symbol: { type: string, pattern: '^[A-Z]{1,8}$' }
        referencePrice: { $ref: '#/components/schemas/Price' }

    InstrumentCreated:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, referencePrice, commandSequence]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        referencePrice: { $ref: '#/components/schemas/Price' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    InstrumentEditRequest:
      type: object
      additionalProperties: false
      required: [referencePrice]
      properties:
        referencePrice: { $ref: '#/components/schemas/Price' }

    InstrumentEdited:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, referencePrice, commandSequence]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        referencePrice: { $ref: '#/components/schemas/Price' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    InstrumentDeleted:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, commandSequence]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    InstrumentUsage:
      type: object
      additionalProperties: false
      description: |
        What keeps an instrument from being deleted. holders names the accounts given its shares (a trader's username,
        or a bot's name), at most 20, in name order; holderCount says how many there are. orderCount counts the orders
        sent for it, refused ones included.
      required: [holders, holderCount, orderCount]
      properties:
        holders:
          type: array
          maxItems: 20
          items: { type: string }
        holderCount: { type: integer, minimum: 0 }
        orderCount: { type: integer, minimum: 0 }

    AccountRequest:
      type: object
      additionalProperties: false
      required: [username, cash]
      properties:
        username: { type: string, minLength: 1 }
        cash: { $ref: '#/components/schemas/Money' }
        holdings:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Endowment' }

    Endowment:
      type: object
      additionalProperties: false
      required: [instrumentId, quantity]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        quantity: { type: integer, format: int64, minimum: 1, maximum: 1000000 }

    AccountCreated:
      type: object
      additionalProperties: false
      required: [accountId, username, cash, holdings, commandSequence]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        cash: { $ref: '#/components/schemas/Money' }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Endowment' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    BotsRequest:
      type: object
      additionalProperties: false
      required: [count, cash]
      properties:
        count: { type: integer, minimum: 1, maximum: 100 }
        cash: { $ref: '#/components/schemas/Money' }
        holdings:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Endowment' }

    BotPopulation:
      type: object
      additionalProperties: false
      required: [population, maxPopulation, maxPerCommand]
      properties:
        population: { type: integer, minimum: 0 }
        maxPopulation: { type: integer }
        maxPerCommand: { type: integer }

    BotsCreated:
      type: object
      additionalProperties: false
      required: [created, firstBot, lastBot, population, commandSequence]
      properties:
        created: { type: integer, minimum: 1 }
        firstBot: { type: string }
        lastBot: { type: string }
        population:
          type: integer
          maximum: 1000
          description: Bots in the market after this command.
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    AccountFrame:
      type: object
      additionalProperties: false
      required: [accountVersion]
      properties:
        accountVersion:
          $ref: '#/components/schemas/Sequence'
          description: The command sequence of the account's latest change, or 0.

    AccountHeartbeat:
      type: object
      additionalProperties: false
      required: [at]
      properties:
        at: { type: string, format: date-time }

    TokenRevoked:
      type: object
      additionalProperties: false
      required: [accountId, revoked, commandSequence]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        revoked:
          type: integer
          minimum: 0
          description: Tokens this command revoked; 0 when they already were.
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    BotRunRequest:
      type: object
      additionalProperties: false
      required: [commandsPerSecond]
      properties:
        marketMakers: { type: integer, minimum: 0, maximum: 1000 }
        noise: { type: integer, minimum: 0, maximum: 1000 }
        momentum: { type: integer, minimum: 0, maximum: 1000 }
        seed: { type: integer, format: int64, minimum: 0 }
        commandsPerSecond:
          type: string
          description: Trading commands per second across all the run's bots, from 0.01 to 200.00.
          pattern: '^(0|[1-9][0-9]{0,2})\.[0-9]{2}$'
        maxOrderQuantity: { type: integer, minimum: 1, maximum: 10000, default: 10 }
        maxPosition: { type: integer, minimum: 1, maximum: 1000000, default: 100 }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        instrumentIds:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Uuid' }
    BotRunStarted:
      type: object
      additionalProperties: false
      required: [runId, bots, commandSequence]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        bots: { type: integer, minimum: 1 }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    BotRunStopping:
      type: object
      additionalProperties: false
      required: [runId, commandSequence]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    HealthSummary:
      type: object
      additionalProperties: false
      required: [writer, lastMinute, outbox]
      properties:
        writer:
          type: object
          additionalProperties: false
          required: [available, queueDepth, queueCapacity]
          properties:
            available: { type: boolean, description: 'Running and taking commands; false once halted.' }
            queueDepth: { type: integer, minimum: 0 }
            queueCapacity: { type: integer, minimum: 1 }
        lastMinute:
          type: object
          additionalProperties: false
          required: [committed, failed, withinBudget, refused]
          properties:
            committed: { type: integer, format: int64, minimum: 0 }
            failed: { type: integer, format: int64, minimum: 0 }
            withinBudget: { type: integer, format: int64, minimum: 0 }
            refused:
              type: integer
              format: int64
              minimum: 0
              description: Turned away before admission because the queue was full or the publication backlog stopped new orders. Rate limits are counted separately.
        outbox:
          type: object
          additionalProperties: false
          required: [admitting, pendingEvents, oldestPendingMillis]
          properties:
            admitting: { type: boolean, description: 'False while the publication backlog stops new orders.' }
            pendingEvents:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: Null where the relay does not run.
            oldestPendingMillis:
              type: [integer, 'null']
              format: int64
              minimum: 0
    BotRunList:
      type: object
      additionalProperties: false
      required: [runs, nextCursor]
      properties:
        runs:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/BotRun' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    BotRun:
      type: object
      additionalProperties: false
      required: [runId, status, desiredState, startedAt, endsAt, stopRequestedAt, stoppedAt, config, worker, activity]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        status:
          type: string
          enum: [STARTING, RUNNING, STALE, STOPPING, STOPPED]
          description: |
            STARTING before a worker has taken it; RUNNING while a worker holds a live lease; STALE when the lease
            ran out while it should run; STOPPING until the worker confirms; then STOPPED.
        desiredState: { type: string, enum: [RUNNING, STOPPED] }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        stopRequestedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        stoppedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        config:
          type: object
          additionalProperties: false
          required: [seed, commandsPerSecond, maxOrderQuantity, maxPosition, instruments, strategies]
          properties:
            seed: { $ref: '#/components/schemas/Sequence' }
            commandsPerSecond: { type: string }
            maxOrderQuantity: { type: integer }
            maxPosition: { type: integer }
            instruments:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [instrumentId, symbol]
                properties:
                  instrumentId: { $ref: '#/components/schemas/Uuid' }
                  symbol: { type: string }
            strategies:
              type: object
              additionalProperties: false
              required: [marketMakers, noise, momentum]
              properties:
                marketMakers: { type: integer, minimum: 0 }
                noise: { type: integer, minimum: 0 }
                momentum: { type: integer, minimum: 0 }
        worker:
          type: object
          additionalProperties: false
          required: [workerId, heartbeatAt, leaseExpiresAt]
          properties:
            workerId: { type: [string, 'null'] }
            heartbeatAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            leaseExpiresAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        activity:
          type: object
          additionalProperties: false
          required: [placed, canceled, rejected, errors, inFlight, stopFailures]
          properties:
            placed: { type: integer, format: int64, minimum: 0 }
            canceled: { type: integer, format: int64, minimum: 0 }
            rejected: { type: integer, format: int64, minimum: 0 }
            errors: { type: integer, format: int64, minimum: 0 }
            inFlight: { type: integer, minimum: 0 }
            stopFailures: { type: integer, minimum: 0 }

    SimulatorAssignment:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [runId, desiredState, seed, commandsPerSecond, maxOrderQuantity, maxPosition, endsAt,
                leaseSeconds, instruments, bots, worker, totals]
              properties:
                runId: { $ref: '#/components/schemas/Uuid' }
                desiredState:
                  type: string
                  enum: [RUNNING, STOPPED]
                  description: STOPPED once the run is stopped or its time is up.
                seed: { $ref: '#/components/schemas/Sequence' }
                commandsPerSecond: { type: string }
                maxOrderQuantity: { type: integer }
                maxPosition: { type: integer }
                endsAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
                leaseSeconds: { type: integer, minimum: 1 }
                instruments:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [instrumentId, symbol]
                    properties:
                      instrumentId: { $ref: '#/components/schemas/Uuid' }
                      symbol: { type: string }
                bots:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [accountId, strategy, credentialRef]
                    properties:
                      accountId: { $ref: '#/components/schemas/Uuid' }
                      strategy: { type: string, enum: [MARKET_MAKER, NOISE, MOMENTUM] }
                      credentialRef:
                        type: string
                        description: The file in the simulator's token directory holding this bot's token.
                worker:
                  type: object
                  additionalProperties: false
                  required: [workerId, leaseExpiresAt]
                  properties:
                    workerId: { type: [string, 'null'] }
                    leaseExpiresAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
                totals:
                  type: object
                  additionalProperties: false
                  required: [placed, canceled, rejected, errors]
                  properties:
                    placed: { type: integer, format: int64, minimum: 0 }
                    canceled: { type: integer, format: int64, minimum: 0 }
                    rejected: { type: integer, format: int64, minimum: 0 }
                    errors: { type: integer, format: int64, minimum: 0 }
    SimulatorHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [runId, workerId, placed, canceled, rejected, errors, inFlight, stopFailures]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        workerId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
        placed: { type: integer, format: int64, minimum: 0 }
        canceled: { type: integer, format: int64, minimum: 0 }
        rejected: { type: integer, format: int64, minimum: 0 }
        errors: { type: integer, format: int64, minimum: 0 }
        inFlight: { type: integer, minimum: 0 }
        stopFailures: { type: integer, minimum: 0 }
        stopped:
          type: boolean
          default: false
          description: Confirms the stop; only with inFlight 0, once desiredState is STOPPED.
    SimulatorHeartbeat:
      type: object
      additionalProperties: false
      required: [runId, desiredState, leaseExpiresAt, stopped]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        desiredState: { type: string, enum: [RUNNING, STOPPED] }
        leaseExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        stopped: { type: boolean }

    AccountPage:
      type: object
      additionalProperties: false
      required: [accounts, nextCursor]
      properties:
        accounts:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AccountSummary' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.

    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, username, kind, cash, holdings, token]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        kind: { type: string, enum: [TRADER, BOT] }
        token:
          type: [string, 'null']
          enum: [ACTIVE, REVOKED, null]
          description: A bot's token, ACTIVE until revoked; null for a trader.
        cash:
          $ref: '#/components/schemas/Money'
          description: The cash it started with.
        holdings:
          type: array
          description: The shares it started with.
          items: { $ref: '#/components/schemas/Allocation' }

    Allocation:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, quantity]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        quantity: { type: integer, format: int64 }

    MarketStatus:
      type: object
      additionalProperties: false
      required: [state, simulationId, openedAt, commandSequence]
      properties:
        state: { type: string, enum: [NOT_SET_UP, SETUP, OPEN, HALTED] }
        simulationId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        openedAt:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
          description: When the market first opened; null in SETUP.
        commandSequence:
          oneOf: [{ $ref: '#/components/schemas/Sequence' }, { type: 'null' }]
          description: The last committed command's sequence.

    MarketTransition:
      type: object
      additionalProperties: false
      required: [state, commandSequence]
      properties:
        state: { type: string, enum: [OPEN, HALTED] }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    Feed:
      type: object
      additionalProperties: false
      description: How current the data is. Show staleness to the user rather than presenting old data as live.
      required: [state, lag]
      properties:
        state: { type: string, enum: [STARTING, CATCHING_UP, LIVE, STALE, PAUSED, DISABLED] }
        lag:
          type: integer
          format: int64
          description: Records on Kafka not yet projected; -1 before the first measurement.
    Quote:
      type: object
      additionalProperties: false
      required: [price, quantity, orderCount]
      properties:
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        orderCount: { type: integer }
    Instrument:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, venueState, referencePrice, tick, lotSize, minQuantity, maxQuantity, maxPrice,
        lastPrice, bestBid, bestAsk, lastTradeSequence, sourceCommandSequence, generatedAt, session]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string, pattern: '^[A-Z]{1,8}$' }
        venueState: { $ref: '#/components/schemas/VenueState' }
        referencePrice:
          $ref: '#/components/schemas/Price'
          description: Shown before the first trade; never executable liquidity.
        tick: { $ref: '#/components/schemas/Price' }
        lotSize: { type: integer, format: int64 }
        minQuantity: { type: integer, format: int64 }
        maxQuantity: { type: integer, format: int64 }
        maxPrice: { $ref: '#/components/schemas/Price' }
        lastPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        bestBid:
          oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }]
        bestAsk:
          oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }]
        lastTradeSequence: { $ref: '#/components/schemas/Sequence' }
        sourceCommandSequence: { $ref: '#/components/schemas/Sequence' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        session: { $ref: '#/components/schemas/SessionFigures' }
    SessionFigures:
      type: object
      additionalProperties: false
      description: |
        The instrument's figures since trading began, from the public trade tape, so they need no analytics job. There
        is no opening auction, so the session is measured from the reference price: open is the reference price, and
        change and changePercent are the last trade's price against it, the percentage rounded half-even to two places.
        VWAP is the notional over the volume, rounded half-even to the cent. The trend holds the last trade price of
        each of the last 60 minutes that had a trade, oldest first. Before the first trade, last, change,
        changePercent, high, low and vwap are null, the counts zero and the trend empty. feed is the trade feed's
        state, which the figures come from: while it is behind, so are they, even when the market feed is live.
      required: [open, last, change, changePercent, high, low, volume, tradeCount, vwap, trend, feed]
      properties:
        open: { $ref: '#/components/schemas/Price' }
        last:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        change:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
        changePercent:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
        high:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        low:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        volume: { type: integer, format: int64, minimum: 0 }
        tradeCount: { type: integer, format: int64, minimum: 0 }
        vwap:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        trend:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/TrendPoint' }
        feed: { $ref: '#/components/schemas/Feed' }
    TrendPoint:
      type: object
      additionalProperties: false
      required: [minute, price]
      properties:
        minute: { $ref: '#/components/schemas/Timestamp' }
        price: { $ref: '#/components/schemas/Price' }
    VenueState:
      type: string
      enum: [SETUP, OPEN, HALTED, UNKNOWN]
    Instruments:
      type: object
      additionalProperties: false
      required: [instruments, feed]
      properties:
        instruments:
          type: array
          items: { $ref: '#/components/schemas/Instrument' }
        feed: { $ref: '#/components/schemas/Feed' }
    Book:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, venueState, bids, asks, sourceCommandSequence, generatedAt, feed]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        venueState: { $ref: '#/components/schemas/VenueState' }
        bids:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        asks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        sourceCommandSequence:
          $ref: '#/components/schemas/Sequence'
          description: The market revision; a higher one is newer.
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        feed: { $ref: '#/components/schemas/Feed' }
    Trade:
      type: object
      additionalProperties: false
      required: [tradeId, tradeSequence, price, quantity, executedAt]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        tradeSequence: { $ref: '#/components/schemas/Sequence' }
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
    Trades:
      type: object
      additionalProperties: false
      required: [instrumentId, trades, nextCursor, latestTradeSequence, feed]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        trades:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Trade' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
        latestTradeSequence: { $ref: '#/components/schemas/Sequence' }
        feed: { $ref: '#/components/schemas/Feed' }
    Candle:
      type: object
      additionalProperties: false
      required: [bucketStart, open, high, low, close, volume, tradeCount, notional, vwap, sourceMaxTradeSequence]
      properties:
        bucketStart: { $ref: '#/components/schemas/Timestamp' }
        open: { $ref: '#/components/schemas/Price' }
        high: { $ref: '#/components/schemas/Price' }
        low: { $ref: '#/components/schemas/Price' }
        close: { $ref: '#/components/schemas/Price' }
        volume: { type: integer, format: int64, minimum: 1 }
        tradeCount: { type: integer, format: int64, minimum: 1 }
        notional:
          type: string
          description: Price times quantity summed over the minute, exact, with two decimals; may exceed 64 bits.
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
        vwap:
          $ref: '#/components/schemas/Price'
          description: notional / volume, rounded half-even to the cent.
        sourceMaxTradeSequence:
          $ref: '#/components/schemas/Sequence'
          description: The highest trade sequence this bar includes.
    CandleFreshness:
      type: object
      additionalProperties: false
      required: [feed, candlesThroughTradeSequence, latestTradeSequence, tradesBehind]
      properties:
        feed: { $ref: '#/components/schemas/Feed' }
        candlesThroughTradeSequence:
          oneOf: [{ $ref: '#/components/schemas/Sequence' }, { type: 'null' }]
          description: The highest trade sequence any bar includes; null before the first bar.
        latestTradeSequence:
          $ref: '#/components/schemas/Sequence'
          description: The newest trade on the public tape.
        tradesBehind:
          type: integer
          format: int64
          minimum: 0
          description: Trades on the tape that no bar includes yet. Grows while analytics is down or stopped.
    Candles:
      type: object
      additionalProperties: false
      required: [instrumentId, computationEpoch, from, to, candles, freshness]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        computationEpoch: { type: integer, format: int64, minimum: 1 }
        from: { $ref: '#/components/schemas/Timestamp' }
        to: { $ref: '#/components/schemas/Timestamp' }
        candles:
          type: array
          maxItems: 1440
          items: { $ref: '#/components/schemas/Candle' }
        freshness: { $ref: '#/components/schemas/CandleFreshness' }
    ExportedTrade:
      type: object
      additionalProperties: false
      required: [tradeId, tradeSequence, priceCents, quantity, executedAt, commandSequence]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        tradeSequence: { $ref: '#/components/schemas/Sequence' }
        priceCents: { type: integer, format: int64, minimum: 1 }
        quantity: { type: integer, format: int64, minimum: 1 }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    TradeExport:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, throughSequence, trades, nextCursor]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        throughSequence:
          $ref: '#/components/schemas/Sequence'
          description: The newest trade sequence this export covers.
        trades:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ExportedTrade' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    CandleReconciliation:
      type: object
      additionalProperties: false
      required: [computationEpoch, reconciled, instruments]
      properties:
        computationEpoch: { type: integer, format: int64 }
        reconciled: { type: boolean, description: True when every instrument reconciles. }
        instruments:
          type: array
          items: { $ref: '#/components/schemas/InstrumentReconciliation' }
    InstrumentReconciliation:
      type: object
      additionalProperties: false
      required: [instrumentId, candlesThroughTradeSequence, exportedThroughTradeSequence, candlesChecked, reconciled,
        mismatches]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        candlesThroughTradeSequence: { $ref: '#/components/schemas/Sequence' }
        exportedThroughTradeSequence: { $ref: '#/components/schemas/Sequence' }
        candlesChecked: { type: integer, minimum: 0 }
        reconciled: { type: boolean }
        mismatches:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bucketStart, problem, detail]
            properties:
              bucketStart: { $ref: '#/components/schemas/Timestamp' }
              problem: { type: string, enum: [MISSING, EXTRA, DIFFERENT] }
              detail: { type: string }
    TapeTrade:
      type: object
      additionalProperties: false
      required: [tradeId, tradeSequence, price, quantity, aggressorSide, executedAt]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        tradeSequence: { $ref: '#/components/schemas/Sequence' }
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        aggressorSide: { $ref: '#/components/schemas/Side' }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
    MarketFrame:
      type: object
      additionalProperties: false
      description: Data of a `market` event. Replaces the previous frame entirely.
      required: [bootId, instrumentId, symbol, venueState, sourceCommandSequence, bids, asks, lastPrice, recentTrades,
        lastTradeSequence, generatedAt, feed, session]
      properties:
        bootId: { $ref: '#/components/schemas/Uuid' }
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        venueState: { $ref: '#/components/schemas/VenueState' }
        sourceCommandSequence: { $ref: '#/components/schemas/Sequence' }
        bids:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        asks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        lastPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        recentTrades:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TapeTrade' }
        lastTradeSequence: { $ref: '#/components/schemas/Sequence' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        feed: { $ref: '#/components/schemas/Feed' }
        session: { $ref: '#/components/schemas/SessionFigures' }
    Heartbeat:
      type: object
      additionalProperties: false
      description: Data of a `heartbeat` event. A live connection does not mean current data; check feed.
      required: [bootId, feed, at]
      properties:
        bootId: { $ref: '#/components/schemas/Uuid' }
        feed: { $ref: '#/components/schemas/Feed' }
        at: { $ref: '#/components/schemas/Timestamp' }
