  /api/v1/instruments/{instrumentId}/candles:
    get:
      tags: [market-data]
      operationId: listCandles
      summary: One-minute bars for a time range, oldest first, with how current the analytics are.
      description: |
        Bars with from <= bucketStart < to, at most 1,440 minutes per request. Without from and to, the last two
        hours. A minute without trades has no bar. Bars come from the computation epoch this instance serves.
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: from
          in: query
          schema: { $ref: '#/components/schemas/Timestamp' }
        - name: to
          in: query
          description: Exclusive.
          schema: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: The bars and their freshness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candles' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/instruments/{instrumentId}/market-quality:
    get:
      tags: [market-data]
      operationId: getMarketQuality
      summary: The instrument's book minute by minute over a window of command sequences, with its spread and volatility.
      description: |
        Public facts only, so a bot run's window can be measured from its start and end sequences. The minutes are
        those whose snapshots meet fromSequence..toSequence (both inclusive), from the first to the last, at most
        1,440; a minute at either edge may also hold snapshots outside the window. A minute's book is its last
        snapshot's, and a minute without one holds the minute before (changed false). The average spread is the mean
        of the minutes' best ask minus best bid, over minutes with both sides. Volatility is the sample standard
        deviation of the one-minute returns of the last price (price / previous price - 1, a held price counting as
        0), not annualised. Both are null with nothing to measure. The history comes from the market snapshots: a
        rebuild from Kafka keeps only what the compacted topic still holds, a restore all of it.
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: fromSequence
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: toSequence
          in: query
          required: true
          description: Inclusive; not below fromSequence.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: The minutes and their figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketQuality' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/reconciliation/candles:
    get:
      tags: [market-data]
      operationId: reconcileCandles
      summary: Checks one epoch's stored candles against Execution's trade export, exactly.
      description: |
        Internal: the proxy never forwards it. For every instrument with a snapshot, or one, each candle is
        recomputed from the exported trades up to its own source trade sequence and compared field by field.
        Candles that are behind still reconcile; what they cover must match.
      parameters:
        - name: instrumentId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: epoch
          in: query
          description: The computation epoch to check; the served one by default.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: The result for each instrument.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandleReconciliation' }
        '400': { $ref: '#/components/responses/Problem' }
        '503':
          description: EXPORT_UNAVAILABLE. The export is not configured or cannot be read.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/market-events:
    get:
      tags: [market-data]
      operationId: streamMarket
      summary: Live market for one instrument, as server-sent events.
      description: |
        Event `market` carries a MarketFrame: the complete public state, first on connecting and then at most
        four times a second after committed changes. Each frame replaces the previous one. Event `heartbeat`
        carries a Heartbeat after 10 seconds without a frame. A new bootId means the service restarted.
      parameters:
        - name: instrumentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stream. Each event's data is JSON, a MarketFrame or a Heartbeat.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503':
          description: TOO_MANY_STREAMS. Retry after the Retry-After header.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/account-events:
    get:
      tags: [execution]
      operationId: streamAccount
      summary: The signed-in trader's own change notifications, as server-sent events.
      description: |
        Event `account` carries an AccountFrame: only the account's version, the command sequence of its latest
        change since the service started (0 before any). It comes first on connecting, then after each committed
        command that changed the account: an order placed, rejected, filled (as either side) or cancelled. On each,
        read orders and portfolio from the REST API again; frames carry no private data. Event `heartbeat`
        carries an AccountHeartbeat after 10 seconds without a frame. A trader's session only, never a bot token;
        the stream ends when the session does, at once on logout and within a heartbeat on expiry.
      responses:
        '200':
          description: The stream. Each event's data is JSON, an AccountFrame or an AccountHeartbeat.
          content:
            text/event-stream:
              schema: { type: string }
        '401':
          description: No session. No body.
        '403':
          description: Not a trader, or a bot token. No body, or NO_TRADING_ACCOUNT.
        '503':
          description: |
            TOO_MANY_STREAMS in all. Retry after the Retry-After header. An account's sixth stream is not refused:
            it replaces the account's oldest, which then ends.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-chosen UUID, kept for retries of the same request.
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: |
        The nextCursor of the previous page. Opaque. Refused under an order or filters other than the ones it came
        from.
      schema: { type: string }
    FilterInstrument:
      name: instrumentId
      in: query
      description: Only this instrument's rows.
      schema: { type: string, format: uuid }
    FilterSide:
      name: side
      in: query
      description: Only buys, or only sells.
      schema: { type: string, enum: [BUY, SELL] }
    Order:
      name: order
      in: query
      description: Which end of the list pages start from. Without it, the operation's own default, named in its summary.
      schema: { type: string, enum: [newest, oldest] }

  responses:
    NotTrader:
      description: Not a trader, refused before the controller with no body; or NO_TRADING_ACCOUNT.
      x-may-be-empty: true
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: A problem, with its code.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: |
        RATE_LIMITED: the account sent more trading commands per second than it may (10 for a person, 2 for a
        bot, by default). Nothing was queued, so the same key is safe to send again after Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: EXCHANGE_BUSY (not queued; retry with the same key), or TRADING_UNAVAILABLE. Has Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OutcomeUnknown:
      description: COMMAND_OUTCOME_UNKNOWN. The command may still commit; look it up by commandKey.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Price:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})\.[0-9]{2}$'
      examples: ['100.25']
    SignedAmount:
      type: string
      description: A decimal with exactly two places and a minus sign when negative; no plus sign.
      pattern: '^-?(0|[1-9][0-9]{0,18})\.[0-9]{2}$'
      examples: ['1.03', '-0.50', '0.00']
    Sequence:
      type: string
      pattern: '^[0-9]+$'
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time

    Problem:
      type: object
      required: [status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable reason. Set on every error the application raises.
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
        commandKey: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        restingOrders:
          type: integer
          minimum: 0
          description: |
            With MARKET_CLOSE_UNFINISHED, at most how many orders a closed market still had resting when trading
            stopped. The exchange's own count; fewer may rest, by up to one transaction of the close.
        usage: { $ref: '#/components/schemas/InstrumentUsage' }
        shortfall: { $ref: '#/components/schemas/BotShortfall' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    CsrfToken:
      type: object
      additionalProperties: false
      required: [headerName, token]
      properties:
        headerName: { type: string }
        token: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200 }
    Identity:
      type: object
      additionalProperties: false
      required: [username, roles]
      properties:
        username: { type: string }
        roles:
          type: array
          items: { type: string, enum: [TRADER, OPERATOR] }

    TourSeen:
      type: object
      additionalProperties: false
      required: [seenVersion]
      properties:
        seenVersion: { type: integer, minimum: 0, maximum: 1000 }

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, writeOnly: true }
        newPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 64 }

    TourSeenRequest:
      type: object
      additionalProperties: false
      required: [seenVersion]
      properties:
        seenVersion: { type: integer, minimum: 1, maximum: 1000 }

    OrderRequest:
      type: object
      additionalProperties: false
      description: LIMIT goes with GTC and limitPrice; MARKET_PROTECTED with IOC and protectionPrice.
      required: [instrumentId, side, type, timeInForce, quantity]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        side: { $ref: '#/components/schemas/Side' }
        type: { type: string, enum: [LIMIT, MARKET_PROTECTED] }
        timeInForce: { type: string, enum: [GTC, IOC] }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        limitPrice: { $ref: '#/components/schemas/Price' }
        protectionPrice: { $ref: '#/components/schemas/Price' }
    Side:
      type: string
      enum: [BUY, SELL]
    Order:
      type: object
      additionalProperties: false
      required: [orderId, state, reason, filledQuantity, workingQuantity, canceledQuantity, commandSequence]
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        state: { type: string, enum: [OPEN, PARTIALLY_FILLED, FILLED, CANCELED] }
        reason:
          type: [string, 'null']
          description: Why an IOC remainder was canceled, such as IOC_REMAINDER_CANCELED.
        filledQuantity: { type: integer, format: int64 }
        workingQuantity: { type: integer, format: int64 }
        canceledQuantity: { type: integer, format: int64 }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    OrderDetail:
      type: object
      additionalProperties: false
      required: [orderId, instrumentId, symbol, side, type, timeInForce, limitPrice, protectionPrice,
        requestedQuantity, filledQuantity, workingQuantity, canceledQuantity, state, reason, version, createdAt,
        updatedAt]
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/Side' }
        type: { type: string, enum: [LIMIT, MARKET_PROTECTED] }
        timeInForce: { type: string, enum: [GTC, IOC] }
        limitPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        protectionPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        requestedQuantity: { type: integer, format: int64 }
        filledQuantity: { type: integer, format: int64 }
        workingQuantity: { type: integer, format: int64 }
        canceledQuantity: { type: integer, format: int64 }
        state: { type: string, enum: [OPEN, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED] }
        reason:
          type: [string, 'null']
          description: |
            Why the order was canceled or rejected, or null. A canceled order says CANCELED_BY_OWNER,
            IOC_REMAINDER_CANCELED, SELF_TRADE_PREVENTED or MARKET_CLOSED (it still rested when the market closed);
            a rejected one carries its rejection code.
        version:
          $ref: '#/components/schemas/Sequence'
          description: Increases with every change to the order.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    OrderPage:
      type: object
      additionalProperties: false
      required: [orders, nextCursor]
      properties:
        orders:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/OrderDetail' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page, and always null for status=active.
    Money:
      type: string
      description: An amount with exactly two decimals, such as "12345.67".
      pattern: '^-?(0|[1-9][0-9]{0,18})\.[0-9]{2}$'
    Portfolio:
      type: object
      additionalProperties: false
      required: [cash, holdings, equity, accountVersion, asOfCommandSequence, costBasis, unrealized, unrealizedPercent]
      properties:
        cash: { $ref: '#/components/schemas/Cash' }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Holding' }
        equity:
          $ref: '#/components/schemas/Money'
          description: Total cash plus every holding at its mark; reserved amounts are counted once.
        accountVersion:
          $ref: '#/components/schemas/Sequence'
          description: Increases with every command that changes this account's money or orders.
        asOfCommandSequence:
          $ref: '#/components/schemas/Sequence'
          description: The last command reflected here.
        costBasis:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
          description: |
            Estimated: what the shares held cost by the average-cost rule (Holding.averageCost), totalled; 0.00 with
            no shares. Null for a bot's read, and when any holding with shares has a null averageCost.
        unrealized:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: Estimated, the holdings' value less their cost, totalled. Null when costBasis is.
        unrealizedPercent:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: unrealized as a percentage of costBasis, rounded half-even to two places. Null when costBasis is.
    Cash:
      type: object
      additionalProperties: false
      required: [total, available, reserved]
      properties:
        total: { $ref: '#/components/schemas/Money' }
        available: { $ref: '#/components/schemas/Money' }
        reserved: { $ref: '#/components/schemas/Money' }
    Holding:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, total, available, reserved, mark, value, changePercent, weight, averageCost,
        unrealized, unrealizedPercent]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        total: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        mark: { $ref: '#/components/schemas/Mark' }
        value:
          $ref: '#/components/schemas/Money'
          description: total at the mark.
        changePercent:
          $ref: '#/components/schemas/SignedAmount'
          description: The mark against the instrument's reference price, in percent, rounded half-even to two places.
        weight:
          $ref: '#/components/schemas/Price'
          description: value as a percentage of equity, rounded half-even to two places; 0.00 when equity is zero.
        averageCost:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
          description: |
            Estimated, not a tax-style cost basis: the cost of one share by the average-cost rule, from the account's
            own trades in sequence order, with starting shares at their reference price. A buy averages in at its
            price; a sale leaves the average alone; selling out resets it. Rounded half-even to the cent. Worked out
            from every trade of the account on each read, so it is null for a bot's read. Also null with no shares
            held, and when the account's history does not account for exactly the shares held, rather than wrong.
        unrealized:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: |
            Estimated, value less the shares' cost by the same rule, rounded half-even to the cent. Null when
            averageCost is.
        unrealizedPercent:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
          description: |
            unrealized as a percentage of the shares' cost, rounded half-even to two places. Null when averageCost
            is.
    Mark:
      type: object
      additionalProperties: false
      required: [price, source, at]
      properties:
        price: { $ref: '#/components/schemas/Price' }
        source:
          type: string
          enum: [LAST_TRADE, REFERENCE]
          description: REFERENCE before the instrument's first trade; label it as such.
        at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
          description: When the last trade happened; null for a reference price.
    OwnTrade:
      type: object
      additionalProperties: false
      required: [tradeId, instrumentId, symbol, side, liquidity, price, quantity, notional, executedAt,
        commandSequence]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        side:
          $ref: '#/components/schemas/Side'
          description: The caller's side of the trade.
        liquidity:
          type: string
          enum: [MAKER, TAKER]
          description: MAKER when the caller's order was resting, TAKER when it arrived.
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        notional: { $ref: '#/components/schemas/Money' }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    OwnTradePage:
      type: object
      additionalProperties: false
      required: [trades, nextCursor]
      properties:
        trades:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/OwnTrade' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    Cancellation:
      type: object
      additionalProperties: false
      required: [orderId, status, canceledQuantity, commandSequence]
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [CANCELED, ALREADY_CANCELED] }
        canceledQuantity: { type: integer, format: int64 }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    InstrumentRequest:
      type: object
      additionalProperties: false
      required: [symbol, referencePrice]
      properties:
        symbol: { type: string, pattern: '^[A-Z]{1,8}$' }
        referencePrice: { $ref: '#/components/schemas/Price' }
        displayName: { $ref: '#/components/schemas/DisplayName' }

    DisplayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        A name to show beside the symbol: printable characters in any language, words separated by single plain spaces,
        none at either end. Control and invisible formatting characters are refused (VALIDATION_FAILED,
        INVALID_DISPLAY_NAME), never trimmed or removed.
      examples: ['Nova Dynamics']

    InstrumentCreated:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, displayName, referencePrice, commandSequence]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        displayName:
          description: Null for none, and in answers stored before instruments had names.
          oneOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }]
        referencePrice: { $ref: '#/components/schemas/Price' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    InstrumentEditRequest:
      type: object
      additionalProperties: false
      required: [referencePrice]
      properties:
        referencePrice: { $ref: '#/components/schemas/Price' }
        displayName:
          description: Left out or null removes the name.
          oneOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }]

    InstrumentEdited:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, displayName, referencePrice, commandSequence]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        displayName:
          description: The name now set; null for none, and in answers stored before instruments had names.
          oneOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }]
        referencePrice: { $ref: '#/components/schemas/Price' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    InstrumentDeleted:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, commandSequence]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    InstrumentUsage:
      type: object
      additionalProperties: false
      description: |
        What keeps an instrument from being deleted. holders names the accounts given its shares (a trader's username,
        or a bot's name), at most 20, in name order; holderCount says how many there are. orderCount counts the orders
        sent for it, refused ones included.
      required: [holders, holderCount, orderCount]
      properties:
        holders:
          type: array
          maxItems: 20
          items: { type: string }
        holderCount: { type: integer, minimum: 0 }
        orderCount: { type: integer, minimum: 0 }

    AccountRequest:
      type: object
      additionalProperties: false
      required: [username, cash]
      properties:
        username: { type: string, minLength: 1 }
        cash: { $ref: '#/components/schemas/Money' }
        holdings:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Endowment' }

    Endowment:
      type: object
      additionalProperties: false
      required: [instrumentId, quantity]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        quantity: { type: integer, format: int64, minimum: 1, maximum: 1000000 }

    AccountCreated:
      type: object
      additionalProperties: false
      required: [accountId, username, cash, holdings, commandSequence]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        cash: { $ref: '#/components/schemas/Money' }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Endowment' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    TraderRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      dependentRequired:
        holdings: [cash]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{2,31}$'
          description: 3 to 32 lower-case letters, digits, '.', '-' or '_', starting with a letter or digit; unique ignoring case.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 64
          description: 12 to 64 characters and at most 72 bytes in UTF-8, not the username and not only spaces. Stored only as a bcrypt hash.
        cash:
          $ref: '#/components/schemas/Money'
          description: The trader's starting cash, which gives them an account now. Required with holdings; left out with no holdings, only the login is added.
        holdings:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Endowment' }

    TraderPage:
      type: object
      additionalProperties: false
      required: [traders, nextCursor]
      properties:
        traders:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/TraderSummary' }
        nextCursor:
          type: [string, 'null']

    TraderSummary:
      type: object
      additionalProperties: false
      required: [username, funded]
      properties:
        username: { type: string }
        funded:
          type: boolean
          description: Whether the trader has an account in this market.

    TraderAdded:
      type: object
      additionalProperties: false
      required: [username, accountId, cash, holdings, commandSequence]
      properties:
        username: { type: string }
        accountId:
          description: The trader's account in this simulation, or null when added without one.
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        cash:
          description: The starting cash, or null when added without an account.
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Endowment' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    BotsRequest:
      type: object
      additionalProperties: false
      required: [count, cash, strategy]
      properties:
        count: { type: integer, minimum: 1, maximum: 100 }
        cash: { $ref: '#/components/schemas/Money' }
        holdings:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Endowment' }
        strategy:
          $ref: '#/components/schemas/BotStrategy'
          description: The tag every bot in the batch carries; runs assign each strategy to bots tagged with it.

    BotShortfall:
      type: object
      additionalProperties: false
      required: [strategy, requested, available]
      description: A strategy a bot run asked for more bots of than are tagged with it.
      properties:
        strategy: { $ref: '#/components/schemas/BotStrategy' }
        requested: { type: integer, minimum: 1 }
        available: { type: integer, minimum: 0 }

    BotStrategy:
      type: string
      enum: [MARKET_MAKER, NOISE, MOMENTUM]
      description: The kind of trader a bot plays in a run. A bot is tagged once, when it is created, and keeps it.

    BotPopulation:
      type: object
      additionalProperties: false
      required: [population, maxPerCommand, byStrategy]
      properties:
        population: { type: integer, minimum: 0 }
        maxPerCommand:
          type: integer
          minimum: 1
          description: The most bots one command may create. The population itself has no limit.
        byStrategy:
          type: object
          additionalProperties: false
          description: How many bots carry each tag, and how many none. They add up to population.
          required: [marketMakers, noise, momentum, untagged]
          properties:
            marketMakers: { type: integer, minimum: 0 }
            noise: { type: integer, minimum: 0 }
            momentum: { type: integer, minimum: 0 }
            untagged: { type: integer, minimum: 0 }

    BotsCreated:
      type: object
      additionalProperties: false
      required: [created, firstBot, lastBot, population, strategy, commandSequence]
      properties:
        created: { type: integer, minimum: 1 }
        strategy:
          $ref: '#/components/schemas/BotStrategy'
          description: The tag every new bot carries, as the request gave it.
        firstBot: { type: string }
        lastBot: { type: string }
        population:
          type: integer
          minimum: 1
          description: Bots in the market after this command.
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    AccountFrame:
      type: object
      additionalProperties: false
      required: [accountVersion]
      properties:
        accountVersion:
          $ref: '#/components/schemas/Sequence'
          description: The command sequence of the account's latest change, or 0.

    AccountHeartbeat:
      type: object
      additionalProperties: false
      required: [at]
      properties:
        at: { type: string, format: date-time }

    TokenRevoked:
      type: object
      additionalProperties: false
      required: [accountId, revoked, commandSequence]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        revoked:
          type: integer
          minimum: 0
          description: Tokens this command revoked; 0 when they already were.
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    BotRunRequest:
      type: object
      additionalProperties: false
      required: [commandsPerSecond]
      properties:
        marketMakers: { type: integer, minimum: 0, description: Bots playing market makers; no limit beyond the tagged bots. }
        noise: { type: integer, minimum: 0, description: Bots playing noise traders; no limit beyond the tagged bots. }
        momentum: { type: integer, minimum: 0, description: Bots playing momentum traders; no limit beyond the tagged bots. }
        seed: { type: integer, format: int64, minimum: 0 }
        commandsPerSecond:
          type: string
          description: Trading commands per second across all the run's bots, from 0.01 to 2000.00.
          pattern: '^(0|[1-9][0-9]{0,3})\.[0-9]{2}$'
        maxOrderQuantity: { type: integer, minimum: 1, maximum: 10000, default: 10 }
        maxPosition: { type: integer, minimum: 1, maximum: 1000000, default: 100 }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        instrumentIds:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Uuid' }
    BotRunStarted:
      type: object
      additionalProperties: false
      required: [runId, bots, commandSequence]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        bots: { type: integer, minimum: 1 }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    BotRunStopping:
      type: object
      additionalProperties: false
      required: [runId, commandSequence]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    HealthSummary:
      type: object
      additionalProperties: false
      required: [writer, lastMinute, outbox]
      properties:
        writer:
          type: object
          additionalProperties: false
          required: [available, queueDepth, queueCapacity]
          properties:
            available: { type: boolean, description: 'Running and taking commands; false once halted.' }
            queueDepth: { type: integer, minimum: 0 }
            queueCapacity: { type: integer, minimum: 1 }
        lastMinute:
          type: object
          additionalProperties: false
          required: [committed, failed, withinBudget, refused]
          properties:
            committed: { type: integer, format: int64, minimum: 0 }
            failed: { type: integer, format: int64, minimum: 0 }
            withinBudget: { type: integer, format: int64, minimum: 0 }
            refused:
              type: integer
              format: int64
              minimum: 0
              description: Turned away before admission because the queue was full or the publication backlog stopped new orders. Rate limits are counted separately.
        outbox:
          type: object
          additionalProperties: false
          required: [admitting, pendingEvents, oldestPendingMillis]
          properties:
            admitting: { type: boolean, description: 'False while the publication backlog stops new orders.' }
            pendingEvents:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: Null where the relay does not run.
            oldestPendingMillis:
              type: [integer, 'null']
              format: int64
              minimum: 0
    BotRunList:
      type: object
      additionalProperties: false
      required: [runs, nextCursor]
      properties:
        runs:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/BotRun' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    BotRun:
      type: object
      additionalProperties: false
      required: [runId, status, desiredState, startedAt, endsAt, stopRequestedAt, stoppedAt, config, worker, activity,
        window, manifest]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        status:
          type: string
          enum: [STARTING, RUNNING, STALE, STOPPING, STOPPED]
          description: |
            STARTING before a worker has taken it; RUNNING while a worker holds a live lease; STALE when the lease
            ran out while it should run; STOPPING until the worker confirms; then STOPPED.
        desiredState: { type: string, enum: [RUNNING, STOPPED] }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        stopRequestedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        stoppedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        config:
          type: object
          additionalProperties: false
          required: [seed, commandsPerSecond, maxOrderQuantity, maxPosition, instruments, strategies]
          properties:
            seed: { $ref: '#/components/schemas/Sequence' }
            commandsPerSecond: { type: string }
            maxOrderQuantity: { type: integer }
            maxPosition: { type: integer }
            instruments:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [instrumentId, symbol]
                properties:
                  instrumentId: { $ref: '#/components/schemas/Uuid' }
                  symbol: { type: string }
            strategies:
              type: object
              additionalProperties: false
              required: [marketMakers, noise, momentum]
              properties:
                marketMakers: { type: integer, minimum: 0 }
                noise: { type: integer, minimum: 0 }
                momentum: { type: integer, minimum: 0 }
        worker:
          type: object
          additionalProperties: false
          required: [workerId, heartbeatAt, leaseExpiresAt]
          properties:
            workerId: { type: [string, 'null'] }
            heartbeatAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            leaseExpiresAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        activity:
          type: object
          additionalProperties: false
          required: [placed, canceled, rejected, errors, inFlight, stopFailures]
          properties:
            placed: { type: integer, format: int64, minimum: 0 }
            canceled: { type: integer, format: int64, minimum: 0 }
            rejected: { type: integer, format: int64, minimum: 0 }
            errors: { type: integer, format: int64, minimum: 0 }
            inFlight: { type: integer, minimum: 0 }
            stopFailures: { type: integer, minimum: 0 }
        window:
          type: object
          additionalProperties: false
          required: [startSequence, stopSequence, endSequence, endedBy, endedAt]
          description: |
            The run's commands in the command sequence, from its start to its end. stopSequence is the operator's stop
            command, if there was one. endSequence is null until the run is finished. endedBy says how it ended:
            WORKER (its worker confirmed the stop, after every command of the run), NEXT_START (the next run started
            first, after its worker had gone quiet or when it never had one), MARKET_CLOSE (the market closed while
            the run had not ended; the close is its last command, and its stop too unless it was stopped before), or
            NOT_KEPT (recorded before windows were kept, so it has no end).
          properties:
            startSequence: { $ref: '#/components/schemas/Sequence' }
            stopSequence: { oneOf: [{ $ref: '#/components/schemas/Sequence' }, { type: 'null' }] }
            endSequence: { oneOf: [{ $ref: '#/components/schemas/Sequence' }, { type: 'null' }] }
            endedBy: { type: [string, 'null'], enum: [WORKER, NEXT_START, MARKET_CLOSE, NOT_KEPT, null] }
            endedAt:
              description: |
                When the window ended: when its worker confirmed the stop, when the next run started, or when the
                market closed. Null until then, and for a run recorded before windows were kept. A run's length is
                from startedAt to this.
              oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        manifest:
          description: What the worker reported about itself with the run; null until a worker reports one.
          oneOf: [{ $ref: '#/components/schemas/BotRunManifest' }, { type: 'null' }]
    BotRunManifest:
      type: object
      additionalProperties: false
      description: |
        The first manifest a worker reported with the run, which never changes. reports counts the different ones:
        more than one means a worker with other code or settings took the run over, so the run changed midway.
      required: [version, workerId, reportedAt, runtime, strategies, defaults, reports]
      properties:
        version: { $ref: '#/components/schemas/ManifestVersion' }
        workerId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
        reportedAt: { $ref: '#/components/schemas/Timestamp' }
        runtime: { $ref: '#/components/schemas/ManifestRuntime' }
        strategies: { $ref: '#/components/schemas/ManifestStrategies' }
        defaults: { $ref: '#/components/schemas/ManifestSettings' }
        reports: { type: integer, minimum: 1, maximum: 8 }
    ManifestVersion:
      type: string
      pattern: '^[0-9A-Za-z.+_-]{1,64}$'
      description: The worker's package version and the commit it was built from, such as 0.1.0+27a70d6c1e2f.
      examples: ['0.1.0+27a70d6c1e2f', '0.1.0+27a70d6c1e2f.dirty', '0.1.0+unknown']
    ManifestRuntime:
      type: object
      description: The versions the worker's decisions depend on, by name.
      maxProperties: 20
      propertyNames: { pattern: '^[A-Za-z][A-Za-z0-9]{0,39}$' }
      additionalProperties: { type: string, pattern: '^[ -~]{1,64}$' }
    ManifestSettings:
      type: object
      description: |
        Settings by name, each a boolean, a printable ASCII text of at most 64 characters, or a finite number of at
        most 32 characters written out in full (so 1e300 is refused).
      maxProperties: 20
      propertyNames: { pattern: '^[A-Za-z][A-Za-z0-9]{0,39}$' }
      additionalProperties:
        oneOf: [{ type: number }, { type: boolean }, { type: string, pattern: '^[ -~]{1,64}$' }]
    ManifestStrategies:
      type: object
      description: The settings each strategy runs with.
      propertyNames: { enum: [MARKET_MAKER, NOISE, MOMENTUM] }
      additionalProperties: { $ref: '#/components/schemas/ManifestSettings' }
    SimulatorManifest:
      type: object
      additionalProperties: false
      description: |
        What the worker reports about itself, sent with its heartbeats until one for the run is held; at most 8 KiB as
        stored (TOO_LARGE otherwise). The first one stays the run's; a different later one is kept beside it, up to
        eight in all, after which more are answered but not kept.
      required: [version, runtime, strategies, defaults]
      properties:
        version: { $ref: '#/components/schemas/ManifestVersion' }
        runtime: { $ref: '#/components/schemas/ManifestRuntime' }
        strategies: { $ref: '#/components/schemas/ManifestStrategies' }
        defaults: { $ref: '#/components/schemas/ManifestSettings' }

    BotRunMark:
      type: object
      additionalProperties: false
      required: [price, source]
      description: A price at an edge of the run, and where it came from.
      properties:
        price: { $ref: '#/components/schemas/Price' }
        source: { type: string, enum: [LAST_TRADE, REFERENCE] }

    BotRunDetail:
      type: object
      additionalProperties: false
      required: [run, figures]
      properties:
        run: { $ref: '#/components/schemas/BotRun' }
        figures:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [computedAt, instruments, strategies]
              properties:
                computedAt: { $ref: '#/components/schemas/Timestamp' }
                instruments:
                  type: array
                  description: |
                    Per instrument the run traded: every trade in its window by anyone, people included, and the mark
                    at each edge (the newest trade's price, or the reference price before any trade).
                  items:
                    type: object
                    additionalProperties: false
                    required: [instrumentId, symbol, trades, volume, notional, startMark, endMark]
                    properties:
                      instrumentId: { $ref: '#/components/schemas/Uuid' }
                      symbol: { type: string }
                      trades: { type: integer, format: int64, minimum: 0 }
                      volume: { type: integer, format: int64, minimum: 0 }
                      notional: { $ref: '#/components/schemas/Money' }
                      startMark: { $ref: '#/components/schemas/BotRunMark' }
                      endMark: { $ref: '#/components/schemas/BotRunMark' }
                strategies:
                  type: array
                  description: |
                    Per strategy, over the run's bots. placements and cancels count the commands answered in the
                    window, refusals included; refusals are counted again by the code their answer carried (refusals
                    before the exchange records anything, such as rate limits, aren't counted). placedQuantity is what
                    the orders accepted in the window in the run's instruments asked for, filledQuantity what of it
                    filled in the window. trades, volume and notional are the strategy's side of each trade (a trade
                    between two of its bots counts twice). pnl is an estimate: cashChange plus holdingsEnd minus
                    holdingsStart, the run's instruments valued at the marks, reserved amounts counted once.
                  items:
                    type: object
                    additionalProperties: false
                    required: [strategy, bots, placements, cancels, refusals, placedQuantity, filledQuantity, trades,
                      volume, notional, cashChange, holdingsStart, holdingsEnd, pnl]
                    properties:
                      strategy: { type: string, enum: [MARKET_MAKER, NOISE, MOMENTUM] }
                      bots: { type: integer, minimum: 1 }
                      placements: { type: integer, format: int64, minimum: 0 }
                      cancels: { type: integer, format: int64, minimum: 0 }
                      refusals:
                        type: array
                        description: Empty when none of the strategy's commands were refused.
                        items:
                          type: object
                          additionalProperties: false
                          required: [code, commands]
                          properties:
                            code: { type: string }
                            commands: { type: integer, format: int64, minimum: 1 }
                      placedQuantity: { type: integer, format: int64, minimum: 0 }
                      filledQuantity: { type: integer, format: int64, minimum: 0 }
                      trades: { type: integer, format: int64, minimum: 0 }
                      volume: { type: integer, format: int64, minimum: 0 }
                      notional: { $ref: '#/components/schemas/Money' }
                      cashChange: { $ref: '#/components/schemas/SignedAmount' }
                      holdingsStart: { $ref: '#/components/schemas/Money' }
                      holdingsEnd: { $ref: '#/components/schemas/Money' }
                      pnl: { $ref: '#/components/schemas/SignedAmount' }

    SimulatorAssignment:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [runId, desiredState, seed, commandsPerSecond, maxOrderQuantity, maxPosition, endsAt,
                leaseSeconds, instruments, botCount, worker, totals]
              properties:
                runId: { $ref: '#/components/schemas/Uuid' }
                desiredState:
                  type: string
                  enum: [RUNNING, STOPPED]
                  description: STOPPED once the run is stopped or its time is up.
                seed: { $ref: '#/components/schemas/Sequence' }
                commandsPerSecond: { type: string }
                maxOrderQuantity: { type: integer }
                maxPosition: { type: integer }
                endsAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
                leaseSeconds: { type: integer, minimum: 1 }
                instruments:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [instrumentId, symbol]
                    properties:
                      instrumentId: { $ref: '#/components/schemas/Uuid' }
                      symbol: { type: string }
                botCount:
                  type: integer
                  minimum: 1
                  description: How many bots the run's pages hold.
                worker:
                  type: object
                  additionalProperties: false
                  required: [workerId, leaseExpiresAt]
                  properties:
                    workerId: { type: [string, 'null'] }
                    leaseExpiresAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
                totals:
                  type: object
                  additionalProperties: false
                  required: [placed, canceled, rejected, errors]
                  properties:
                    placed: { type: integer, format: int64, minimum: 0 }
                    canceled: { type: integer, format: int64, minimum: 0 }
                    rejected: { type: integer, format: int64, minimum: 0 }
                    errors: { type: integer, format: int64, minimum: 0 }
    SimulatorBotPage:
      type: object
      additionalProperties: false
      required: [bots, nextCursor]
      properties:
        bots:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [accountId, strategy, credentialRef]
            properties:
              accountId: { $ref: '#/components/schemas/Uuid' }
              strategy: { type: string, enum: [MARKET_MAKER, NOISE, MOMENTUM] }
              credentialRef:
                type: string
                description: The file in the simulator's token directory holding this bot's token.
        nextCursor:
          type: [string, 'null']
          description: Pass it back for the next page; null after the last.

    SimulatorHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [runId, workerId, placed, canceled, rejected, errors, inFlight, stopFailures]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        workerId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
        placed: { type: integer, format: int64, minimum: 0 }
        canceled: { type: integer, format: int64, minimum: 0 }
        rejected: { type: integer, format: int64, minimum: 0 }
        errors: { type: integer, format: int64, minimum: 0 }
        inFlight: { type: integer, minimum: 0 }
        stopFailures: { type: integer, minimum: 0 }
        stopped:
          type: boolean
          default: false
          description: Confirms the stop; only with inFlight 0, once desiredState is STOPPED.
        manifest: { $ref: '#/components/schemas/SimulatorManifest' }
    SimulatorHeartbeat:
      type: object
      additionalProperties: false
      required: [runId, desiredState, leaseExpiresAt, stopped]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        desiredState: { type: string, enum: [RUNNING, STOPPED] }
        leaseExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        stopped: { type: boolean }

    AccountPage:
      type: object
      additionalProperties: false
      required: [accounts, nextCursor]
      properties:
        accounts:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AccountSummary' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.

    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, username, kind, cash, holdings, token, strategy]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        kind: { type: string, enum: [TRADER, BOT] }
        strategy:
          description: A bot's tag; null for a trader, and for a bot made without one.
          oneOf: [{ $ref: '#/components/schemas/BotStrategy' }, { type: 'null' }]
        token:
          type: [string, 'null']
          enum: [ACTIVE, REVOKED, null]
          description: A bot's token, ACTIVE until revoked; null for a trader.
        cash:
          $ref: '#/components/schemas/Money'
          description: The cash it started with.
        holdings:
          type: array
          description: The shares it started with.
          items: { $ref: '#/components/schemas/Allocation' }

    Allocation:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, quantity]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        quantity: { type: integer, format: int64 }

    MarketStatus:
      type: object
      additionalProperties: false
      required: [state, simulationId, openedAt, closedAt, commandSequence]
      description: |
        The current simulation's phase: the one that is not closed or, after a close, the one closed last, until
        another is set up.
      properties:
        state:
          type: string
          enum: [NOT_SET_UP, SETUP, OPEN, HALTED, CLOSED]
          description: CLOSED is final. The simulation has ended and takes no more orders.
        simulationId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        openedAt:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
          description: When the market first opened; null in SETUP.
        closedAt:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
          description: When the market closed; null unless the state is CLOSED.
        commandSequence:
          oneOf: [{ $ref: '#/components/schemas/Sequence' }, { type: 'null' }]
          description: The last committed command's sequence.

    MarketTransition:
      type: object
      additionalProperties: false
      required: [state, commandSequence]
      properties:
        state: { type: string, enum: [OPEN, HALTED] }
        commandSequence: { $ref: '#/components/schemas/Sequence' }

    MarketClosed:
      type: object
      additionalProperties: false
      required: [state, commandSequence, canceledOrders, endedRuns]
      properties:
        state: { type: string, enum: [CLOSED] }
        commandSequence:
          $ref: '#/components/schemas/Sequence'
          description: The close's own sequence. The transactions that cancel the rest of the orders follow it.
        canceledOrders:
          type: integer
          minimum: 0
          description: How many orders rested when the market closed. None of them rests once this answer is given.
        endedRuns:
          type: integer
          minimum: 0
          description: How many bot runs the close ended.

    Feed:
      type: object
      additionalProperties: false
      description: How current the data is. Show staleness to the user rather than presenting old data as live.
      required: [state, lag]
      properties:
        state: { type: string, enum: [STARTING, CATCHING_UP, LIVE, STALE, PAUSED, DISABLED] }
        lag:
          type: integer
          format: int64
          description: Records on Kafka not yet projected; -1 before the first measurement.
    Quote:
      type: object
      additionalProperties: false
      required: [price, quantity, orderCount]
      properties:
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        orderCount: { type: integer }
    Instrument:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, displayName, venueState, referencePrice, tick, lotSize, minQuantity, maxQuantity,
        maxPrice, lastPrice, bestBid, bestAsk, lastTradeSequence, sourceCommandSequence, generatedAt, session]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string, pattern: '^[A-Z]{1,8}$' }
        displayName:
          description: Shown beside the symbol; null for none.
          oneOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }]
        venueState: { $ref: '#/components/schemas/VenueState' }
        referencePrice:
          $ref: '#/components/schemas/Price'
          description: Shown before the first trade; never executable liquidity.
        tick: { $ref: '#/components/schemas/Price' }
        lotSize: { type: integer, format: int64 }
        minQuantity: { type: integer, format: int64 }
        maxQuantity: { type: integer, format: int64 }
        maxPrice: { $ref: '#/components/schemas/Price' }
        lastPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        bestBid:
          oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }]
        bestAsk:
          oneOf: [{ $ref: '#/components/schemas/Quote' }, { type: 'null' }]
        lastTradeSequence: { $ref: '#/components/schemas/Sequence' }
        sourceCommandSequence: { $ref: '#/components/schemas/Sequence' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        session: { $ref: '#/components/schemas/SessionFigures' }
    SessionFigures:
      type: object
      additionalProperties: false
      description: |
        The instrument's figures since trading began, from the public trade tape, so they need no analytics job. There
        is no opening auction, so the session is measured from the reference price: open is the reference price, and
        change and changePercent are the last trade's price against it, the percentage rounded half-even to two places.
        VWAP is the notional over the volume, rounded half-even to the cent. The trend holds the last trade price of
        each of the last 60 minutes that had a trade, oldest first. Before the first trade, last, change,
        changePercent, high, low and vwap are null, the counts zero and the trend empty. feed is the trade feed's
        state, which the figures come from: while it is behind, so are they, even when the market feed is live.
      required: [open, last, change, changePercent, high, low, volume, tradeCount, vwap, trend, feed]
      properties:
        open: { $ref: '#/components/schemas/Price' }
        last:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        change:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
        changePercent:
          oneOf: [{ $ref: '#/components/schemas/SignedAmount' }, { type: 'null' }]
        high:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        low:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        volume: { type: integer, format: int64, minimum: 0 }
        tradeCount: { type: integer, format: int64, minimum: 0 }
        vwap:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        trend:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/TrendPoint' }
        feed: { $ref: '#/components/schemas/Feed' }
    TrendPoint:
      type: object
      additionalProperties: false
      required: [minute, price]
      properties:
        minute: { $ref: '#/components/schemas/Timestamp' }
        price: { $ref: '#/components/schemas/Price' }
    VenueState:
      type: string
      description: |
        The trading phase as of the instrument's latest snapshot. CLOSED is final: the simulation has ended, and the
        last price stays as the instrument's final price. UNKNOWN is a phase this service does not know.
      enum: [SETUP, OPEN, HALTED, CLOSED, UNKNOWN]
    Instruments:
      type: object
      additionalProperties: false
      required: [instruments, feed]
      properties:
        instruments:
          type: array
          items: { $ref: '#/components/schemas/Instrument' }
        feed: { $ref: '#/components/schemas/Feed' }
    Book:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, displayName, venueState, bids, asks, sourceCommandSequence, generatedAt, feed]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        displayName:
          description: Shown beside the symbol; null for none.
          oneOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }]
        venueState: { $ref: '#/components/schemas/VenueState' }
        bids:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        asks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        sourceCommandSequence:
          $ref: '#/components/schemas/Sequence'
          description: The market revision; a higher one is newer.
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        feed: { $ref: '#/components/schemas/Feed' }
    Trade:
      type: object
      additionalProperties: false
      required: [tradeId, tradeSequence, price, quantity, executedAt]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        tradeSequence: { $ref: '#/components/schemas/Sequence' }
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
    Trades:
      type: object
      additionalProperties: false
      required: [instrumentId, trades, nextCursor, latestTradeSequence, feed]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        trades:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Trade' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
        latestTradeSequence: { $ref: '#/components/schemas/Sequence' }
        feed: { $ref: '#/components/schemas/Feed' }
    Candle:
      type: object
      additionalProperties: false
      required: [bucketStart, open, high, low, close, volume, tradeCount, notional, vwap, sourceMaxTradeSequence]
      properties:
        bucketStart: { $ref: '#/components/schemas/Timestamp' }
        open: { $ref: '#/components/schemas/Price' }
        high: { $ref: '#/components/schemas/Price' }
        low: { $ref: '#/components/schemas/Price' }
        close: { $ref: '#/components/schemas/Price' }
        volume: { type: integer, format: int64, minimum: 1 }
        tradeCount: { type: integer, format: int64, minimum: 1 }
        notional:
          type: string
          description: Price times quantity summed over the minute, exact, with two decimals; may exceed 64 bits.
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
        vwap:
          $ref: '#/components/schemas/Price'
          description: notional / volume, rounded half-even to the cent.
        sourceMaxTradeSequence:
          $ref: '#/components/schemas/Sequence'
          description: The highest trade sequence this bar includes.
    CandleFreshness:
      type: object
      additionalProperties: false
      required: [feed, candlesThroughTradeSequence, latestTradeSequence, tradesBehind]
      properties:
        feed: { $ref: '#/components/schemas/Feed' }
        candlesThroughTradeSequence:
          oneOf: [{ $ref: '#/components/schemas/Sequence' }, { type: 'null' }]
          description: The highest trade sequence any bar includes; null before the first bar.
        latestTradeSequence:
          $ref: '#/components/schemas/Sequence'
          description: The newest trade on the public tape.
        tradesBehind:
          type: integer
          format: int64
          minimum: 0
          description: Trades on the tape that no bar includes yet. Grows while analytics is down or stopped.
    Candles:
      type: object
      additionalProperties: false
      required: [instrumentId, computationEpoch, from, to, candles, freshness]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        computationEpoch: { type: integer, format: int64, minimum: 1 }
        from: { $ref: '#/components/schemas/Timestamp' }
        to: { $ref: '#/components/schemas/Timestamp' }
        candles:
          type: array
          maxItems: 1440
          items: { $ref: '#/components/schemas/Candle' }
        freshness: { $ref: '#/components/schemas/CandleFreshness' }
    QualityMinute:
      type: object
      additionalProperties: false
      description: A minute's book, its last snapshot's; changed is false when it holds the minute before.
      required: [minute, bestBid, bestAsk, spread, lastPrice, changed]
      properties:
        minute: { $ref: '#/components/schemas/Timestamp' }
        bestBid:
          description: Null while no one bids.
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        bestAsk:
          description: Null while no one asks.
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        spread:
          description: Best ask minus best bid; null unless both sides are there.
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        lastPrice:
          description: Null before the first trade.
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        changed: { type: boolean }
    MarketQuality:
      type: object
      additionalProperties: false
      required: [instrumentId, fromSequence, toSequence, minutes, averageSpread, twoSidedMinutes, volatility, returns,
        feed]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        fromSequence: { $ref: '#/components/schemas/Sequence' }
        toSequence: { $ref: '#/components/schemas/Sequence' }
        minutes:
          type: array
          maxItems: 1440
          items: { $ref: '#/components/schemas/QualityMinute' }
        averageSpread:
          description: A price with four places, rounded half-even; null without a minute with both sides.
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]{0,18})\.[0-9]{4}$'
        twoSidedMinutes: { type: integer, minimum: 0, description: The minutes the average spread is taken over. }
        volatility:
          description: A fraction with six places, rounded half-even; null with fewer than two returns.
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{6}$'
        returns: { type: integer, minimum: 0, description: The one-minute returns the volatility is taken over. }
        feed: { $ref: '#/components/schemas/Feed' }
    ExportedTrade:
      type: object
      additionalProperties: false
      required: [tradeId, tradeSequence, priceCents, quantity, executedAt, commandSequence]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        tradeSequence: { $ref: '#/components/schemas/Sequence' }
        priceCents: { type: integer, format: int64, minimum: 1 }
        quantity: { type: integer, format: int64, minimum: 1 }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
        commandSequence: { $ref: '#/components/schemas/Sequence' }
    TradeExport:
      type: object
      additionalProperties: false
      required: [instrumentId, symbol, throughSequence, trades, nextCursor]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        throughSequence:
          $ref: '#/components/schemas/Sequence'
          description: The newest trade sequence this export covers.
        trades:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ExportedTrade' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    CandleReconciliation:
      type: object
      additionalProperties: false
      required: [computationEpoch, reconciled, instruments]
      properties:
        computationEpoch: { type: integer, format: int64 }
        reconciled: { type: boolean, description: True when every instrument reconciles. }
        instruments:
          type: array
          items: { $ref: '#/components/schemas/InstrumentReconciliation' }
    InstrumentReconciliation:
      type: object
      additionalProperties: false
      required: [instrumentId, candlesThroughTradeSequence, exportedThroughTradeSequence, candlesChecked, reconciled,
        mismatches]
      properties:
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        candlesThroughTradeSequence: { $ref: '#/components/schemas/Sequence' }
        exportedThroughTradeSequence: { $ref: '#/components/schemas/Sequence' }
        candlesChecked: { type: integer, minimum: 0 }
        reconciled: { type: boolean }
        mismatches:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bucketStart, problem, detail]
            properties:
              bucketStart: { $ref: '#/components/schemas/Timestamp' }
              problem: { type: string, enum: [MISSING, EXTRA, DIFFERENT] }
              detail: { type: string }
    TapeTrade:
      type: object
      additionalProperties: false
      required: [tradeId, tradeSequence, price, quantity, aggressorSide, executedAt]
      properties:
        tradeId: { $ref: '#/components/schemas/Uuid' }
        tradeSequence: { $ref: '#/components/schemas/Sequence' }
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer, format: int64 }
        aggressorSide: { $ref: '#/components/schemas/Side' }
        executedAt: { $ref: '#/components/schemas/Timestamp' }
    MarketFrame:
      type: object
      additionalProperties: false
      description: Data of a `market` event. Replaces the previous frame entirely.
      required: [bootId, instrumentId, symbol, displayName, venueState, sourceCommandSequence, bids, asks, lastPrice,
        recentTrades, lastTradeSequence, generatedAt, feed, session]
      properties:
        bootId: { $ref: '#/components/schemas/Uuid' }
        instrumentId: { $ref: '#/components/schemas/Uuid' }
        symbol: { type: string }
        displayName:
          description: Shown beside the symbol; null for none.
          oneOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }]
        venueState: { $ref: '#/components/schemas/VenueState' }
        sourceCommandSequence: { $ref: '#/components/schemas/Sequence' }
        bids:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        asks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Quote' }
        lastPrice:
          oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }]
        recentTrades:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TapeTrade' }
        lastTradeSequence: { $ref: '#/components/schemas/Sequence' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        feed: { $ref: '#/components/schemas/Feed' }
        session: { $ref: '#/components/schemas/SessionFigures' }
    Heartbeat:
      type: object
      additionalProperties: false
      description: Data of a `heartbeat` event. A live connection does not mean current data; check feed.
      required: [bootId, feed, at]
      properties:
        bootId: { $ref: '#/components/schemas/Uuid' }
        feed: { $ref: '#/components/schemas/Feed' }
        at: { $ref: '#/components/schemas/Timestamp' }
