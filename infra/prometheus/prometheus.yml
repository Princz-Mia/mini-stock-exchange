global:
  scrape_interval: 15s

scrape_configs:
  - job_name: execution-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [execution-service:8080]
  - job_name: market-data-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [market-data-service:8080]
